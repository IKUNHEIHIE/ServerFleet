      name: cursor
      in: query
      schema: *id001
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 200
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: *id001
      description: 资源 revision 对应的强 ETag，防止丢失更新
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: 同一主体+操作+请求摘要去重；相同 key 不同参数 409
    CSRF:
      name: X-CSRF-Token
      in: header
      required: false
      schema: *id001
      description: Cookie 会话变更操作必须提供；Bearer 请求不使用此字段
