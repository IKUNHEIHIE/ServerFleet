components:
  schemas:
    Problem:
      type: object
      properties:
        type: *id001
        title: *id001
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail: *id001
        instance: *id001
        code: *id001
        requestId: *id001
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              pointer: *id001
              message: *id001
            additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - requestId
      additionalProperties: false
    PageMeta:
      type: object
      properties:
        nextCursor:
          type:
          - string
          - 'null'
        limit:
          type: integer
          minimum: 1
          maximum: 200
        hasMore:
          type: boolean
      required:
      - limit
      - hasMore
      additionalProperties: false
    Identity:
      type: object
      properties:
        userId: *id001
        displayName: *id001
        roles:
          type: array
          items: *id001
        permissions:
          type: array
          items: *id001
        isBootstrapAdmin:
          type: boolean
      required:
      - userId
      - displayName
      - roles
      additionalProperties: false
    AgentEnrollRequest:
      type: object
      properties:
        enrollmentToken:
          type: string
          writeOnly: true
        requestId: *id001
        csrPem:
          type: string
          writeOnly: true
        pinnedRootSpkiSha256: *id001
        agentVersion: *id001
        platform: *id001
      required:
      - enrollmentToken
      - requestId
      - csrPem
      - pinnedRootSpkiSha256
      - agentVersion
      additionalProperties: false
    AgentEnrollResult:
      type: object
      properties:
        state:
          type: string
          enum:
          - pending
          - issued
          - denied
        nodeId: *id001
        certificatePem: *id001
        intermediateChainPem: *id001
        agentEndpoint: *id001
        reasonCode: *id001
      required:
      - state
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        username: *id001
        password:
          type: string
          writeOnly: true
        secondFactorCode:
          type: string
          writeOnly: true
      required:
      - username
      - password
      additionalProperties: false
    BootstrapRequest:
      type: object
      properties:
        setupToken:
          type: string
          writeOnly: true
        username: *id001
        password:
          type: string
          writeOnly: true
      required:
      - setupToken
      - username
      - password
      additionalProperties: false
    BootstrapState:
      type: object
      properties:
        bootstrapAvailable:
          type: boolean
        setupMethod:
          type: string
          enum:
          - local-console-token
        initialized:
          type: boolean
      required:
      - bootstrapAvailable
      - initialized
      additionalProperties: false
    LoginResult:
      type: object
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        sessionExpiresAt: *id002
        csrfToken:
          type: string
          description: 仅针对 Cookie 会话的同源 CSRF 防护；不得存储于日志
      required:
      - identity
      - sessionExpiresAt
      additionalProperties: false
    Session:
      type: object
      properties:
        sessionId: *id001
        createdAt: *id002
        expiresAt: *id002
        lastSeenAt: *id002
        current:
          type: boolean
      required:
      - sessionId
      - expiresAt
      - current
      additionalProperties: false
    UserInput:
      type: object
      properties:
        username: *id001
        displayName: *id001
        password:
          type: string
          writeOnly: true
        roleIds:
          type: array
          items: *id001
        enabled:
          type: boolean
      required:
      - username
      - roleIds
      additionalProperties: false
    User:
      type: object
      properties:
        userId: *id001
        username: *id001
        displayName: *id001
        roleIds:
          type: array
          items: *id001
        enabled:
          type: boolean
        revision:
          type: integer
          minimum: 1
      required:
      - userId
      - username
      - roleIds
      - enabled
      - revision
      additionalProperties: false
    UserPatch:
      type: object
      properties:
        displayName: *id001
        roleIds:
          type: array
          items: *id001
        enabled:
          type: boolean
      additionalProperties: false
    Role:
      type: object
      properties:
        roleId: *id001
        label: *id001
        permissions:
          type: array
          items: *id001
        builtIn:
          type: boolean
      required:
      - roleId
      - label
      - permissions
      additionalProperties: false
    Permission:
      type: object
      properties:
        key: *id001
        description: *id001
        resourceType: *id001
      required:
      - key
      - description
      additionalProperties: false
    GrantRequest:
      type: object
      properties:
        principalId: *id001
        resourceType:
          type: string
          enum:
          - node
          - node_group
          - service_group
        resourceId: *id001
        permissions:
          type: array
          items: *id001
        expiresAt: *id002
      required:
      - principalId
      - resourceType
      - resourceId
      - permissions
      additionalProperties: false
    Grant:
      type: object
      properties:
        grantId: *id001
        principalId: *id001
        resourceType: *id001
        resourceId: *id001
        permissions:
          type: array
          items: *id001
        createdAt: *id002
        expiresAt: *id002
      required:
      - grantId
      - principalId
      - resourceType
      - resourceId
      - permissions
      additionalProperties: false
    AuditEvent:
      type: object
      properties:
        eventId: *id001
        occurredAt: *id002
        actorType:
          type: string
          enum:
          - user
          - agent
          - plugin
          - ai
          - system
        actorId: *id001
        action: *id001
        resourceType: *id001
        resourceId: *id001
        result:
          type: string
          enum:
          - allowed
          - denied
          - success
          - failure
          - partial
        requestId: *id001
        taskId: *id001
        redactedSummary: *id001
      required:
      - eventId
      - occurredAt
      - actorType
      - action
      - result
      - requestId
      additionalProperties: false
    NodeDetail:
      type: object
      properties:
        nodeId: *id001
        displayName: *id001
        status:
          type: string
          enum:
          - online
          - offline
          - suspended
          - revoked
          - unknown
        lastSeenAt: *id002
        agentVersion: *id001
        platform: *id001
        revision:
          type: integer
          minimum: 1
      required:
      - nodeId
      - displayName
      - status
      - revision
      additionalProperties: false
    NodePatch:
      type: object
      properties:
        displayName: *id001
        tags:
          type: array
          items: *id001
        notes: *id001
      additionalProperties: false
    NodeIdentity:
      type: object
      properties:
        nodeId: *id001
        certificateFingerprintSha256: *id001
        issuerFingerprintSha256: *id001
        serial: *id001
        notAfter: *id002
        revoked:
          type: boolean
        lastVerifiedAt: *id002
      required:
      - nodeId
      - revoked
      additionalProperties: false
    NodeCapabilities:
      type: object
      properties:
        nodeId: *id001
        protocolMajor:
          type: integer
          minimum: 1
        protocolMinor:
          type: integer
          minimum: 0
        capabilities:
          type: array
          items: *id001
        observedAt: *id002
      required:
      - nodeId
      - protocolMajor
      - protocolMinor
      - capabilities
      additionalProperties: false
    NodeActionInput:
      type: object
      properties:
        reason: *id001
        expectedRevision:
          type: integer
          minimum: 1
      required:
      - reason
      additionalProperties: false
    TaskSummary:
      type: object
      properties:
        taskId: *id001
        state:
          type: string
          enum:
          - awaiting_approval
          - queued
          - waiting_node
          - running
          - paused
          - completed
          - partially_failed
          - failed
          - canceling
          - canceled
          - unknown
          - expired
        createdAt: *id002
        createdBy: *id001
        targetNodeIdsSnapshot:
          type: array
          items: *id001
          maxItems: 1000
        revision:
          type: integer
          minimum: 1
        planDigest: *id001
        expiresAt: *id002
      required:
      - taskId
      - state
      - createdAt
      - targetNodeIdsSnapshot
      - revision
      - planDigest
      additionalProperties: false
    TaskExecution:
      type: object
      properties:
        executionId: *id001
        taskId: *id001
        nodeId: *id001
        state:
          type: string
          enum:
          - queued
          - waiting_node
          - offered
          - acknowledged
          - running
          - succeeded
          - failed
          - cancel_requested
          - canceled
          - timed_out
          - unknown
          - expired
        startedAt: *id002
        finishedAt: *id002
        exitCode:
          type:
          - integer
          - 'null'
        outputTruncated:
          type: boolean
        lastSequence:
          type: integer
          minimum: 0
      required:
      - executionId
      - taskId
      - nodeId
      - state
      - lastSequence
      additionalProperties: false
    TaskDecision:
      type: object
      properties:
        planDigest: *id001
        decision:
          type: string
          enum:
          - approve
          - deny
        reason: *id001
      required:
      - planDigest
      - decision
      additionalProperties: false
    TaskAction:
      type: object
      properties:
        reason: *id001
        expectedRevision:
          type: integer
          minimum: 1
      required:
      - reason
      additionalProperties: false
    AIMessageInput:
      type: object
      properties:
        content:
          type: string
          maxLength: 32000
        clientMessageId: *id001
        scopeRevision:
          type: integer
          minimum: 0
      required:
      - content
      - clientMessageId
      - scopeRevision
      additionalProperties: false
    AIMessage:
      type: object
      properties:
        messageId: *id001
        sessionId: *id001
        role:
          type: string
          enum:
          - user
          - assistant
          - tool
        redactedContent: *id001
        createdAt: *id002
        taskIds:
          type: array
          items: *id001
      required:
      - messageId
      - sessionId
      - role
      - createdAt
      additionalProperties: false
    ListSessions:
      type: object
      properties:
        items:
          type: array
          items:
