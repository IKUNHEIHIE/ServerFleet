        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
      parameters:
      - name: userId
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/CSRF'
  /api/v1/roles:
    get:
      tags:
