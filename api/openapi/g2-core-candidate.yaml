openapi: 3.1.0
info:
  title: Server Fleet G2 核心 API 候选契约
  version: 0.9.0-g2-candidate
  description: G2 设计审查稿：仅补充认证/权限、节点身份、任务、审计和 AI 消息事件。不是已冻结或已部署接口；现有主 API 保留。
servers:
- url: /
security:
- cookieSession: []
- bearerAuth: []
tags:
- name: Authentication
- name: Identity
- name: Authorization
- name: Audit
- name: NodeLifecycle
- name: Tasks
- name: AIEvents
paths:
  /api/v1/auth/bootstrap-status:
    get:
      tags:
      - Authentication
      operationId: getBootstrapStatus
      summary: 检查是否允许首次初始化
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapState'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '412':
          $ref: '#/components/responses/Error412'
        '428':
          $ref: '#/components/responses/Error428'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
  /api/v1/auth/bootstrap:
    post:
      tags:
      - Authentication
      operationId: bootstrapInitialAdmin
      summary: 以本机一次性安装令牌初始化首位管理员
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '412':
          $ref: '#/components/responses/Error412'
        '428':
          $ref: '#/components/responses/Error428'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapRequest'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      security: []
  /api/v1/agent/enroll:
    post:
      tags:
      - Authentication
      operationId: enrollAgentWithCSR
      summary: 以短期注册令牌与私钥持有证明请求单节点身份
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEnrollResult'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '412':
          $ref: '#/components/responses/Error412'
        '428':
          $ref: '#/components/responses/Error428'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentEnrollRequest'
      security: []
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      operationId: login
      summary: 认证并创建限时 HttpOnly 会话
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
