openapi: 3.1.0
info:
  title: Server Fleet v0.9 G2 组合候选 API（未冻结）
  version: 0.9.0-g2-candidate
  description: '本文件从 v0.7 docs-r1 基线继承全部既有契约，新增服务发布、可用性监控、安全批量执行、节点/主控恢复、安全凭据管理及流量配额和到期提醒。只描述设计，真实 Controller/Agent
    未部署。跨模块鉴权、审批、幂等、任务快照、审计、秘密不回显须由服务端实施。 v0.8 安全执行策略用于现有任务系统的服务端创建与执行链；安全计划接口仅负责计算，不执行任务。

    插件扩展（FR-PLUGIN-XRAY-001）：首版只批准 Xray 节点管理器，独立 OpenAPI 契约为 Plugin/xray-manager/Xray-Manager-OpenAPI.yaml。未安装插件时插件
    API 不应可调用。

    G2 候选扩展：新增认证、RBAC、审计、节点身份、任务查询/SSE/审批和 AI 消息接口。原 151 项操作的 operationId、路径和入参保持不变。此文件用于评审，不可将它当成已冻结的生产契约。'
servers:
- url: https://server-fleet.example.invalid
  description: 示意服务地址，非真实 API
security:
- bearerAuth: []
tags:
- name: Nodes
  description: 供文件互传界面选择源/目标节点
- name: Files
  description: 目录与文件操作
- name: Uploads
  description: 上传会话声明（文件字节传输方式待实现选型）
- name: Transfers
  description: 节点之间的异步复制任务
- name: DNSProviders
  description: DNS 供应商目录及能力信息；首版仅 cloudflare
- name: DNSAccounts
  description: DNS 供应商账号及凭证生命周期
- name: DNSZones
  description: 按账号列出/同步 DNS Zone
- name: DNSRecords
  description: 按 Zone 修改 DNS 记录
- name: Gateways
  description: 初始规划 4 台 Nginx 应用网关，数量不设固定上限；含路由管理草案
- name: GatewayProvisioning
  description: Nginx 网关安装、检查、维护和调度准入
- name: Notifications
  description: 第一版 QQ Bot 与 SMTP 通知（不含 Telegram）
- name: PluginRepositories
  description: GitHub 官方/Fork 仓库配置
- name: PluginCatalog
  description: 按需发现插件元数据，不自动安装
- name: PluginLifecycle
  description: 插件安装、热启停、热更新及热卸载
- name: NodeEnrollment
  description: “添加节点”页面的凭证与审批
- name: NodeGroups
  description: 自定义节点整理分组与只读自动分类；v0.7 统一查询、批量成员调整及审计，与 ServiceGroups 调度严格区分
- name: ControllerUpdates
  description: 检查主控更新、安全升级、失败恢复
- name: ServiceGroups
  description: 区别于标签式 NodeGroups 的业务服务组与健康调度
- name: InternalCertificates
  description: 内部 TLS 信任包与独立身份凭证的下发、轮换、撤销
- name: AISessions
  description: AI 会话默认零授权，资源快照与撤权
- name: AITools
  description: 所有 AI 工具调用及计划审批都必须由后端实际授权
- name: AIApprovals
  description: 每次审批、自动审批、限时完全访问与审计；服务端强制执行
- name: Publications
  description: 复用服务组、网关、DNS 与证书的 HTTP/HTTPS 服务发布向导及异步记录
- name: AvailabilityMonitors
  description: HTTP/TCP/TLS 可用性监控、目标授权、维护暂停与状态判定
- name: SafeTasks
  description: 批量任务执行策略/阶段/熔断与过期保护；复用原任务系统
- name: NodeDiagnostics
  description: 节点失联诊断、重连和身份验证结果
- name: DisasterRecovery
  description: 备份校验、主控恢复计划与受控执行
- name: CredentialVault
  description: 只写安全凭据、使用范围、引用、轮换与撤销，读取不返回秘密
- name: TrafficLifecycle
  description: 流量配额、独立周期、估算数据质量与到期提醒
- name: Xray Manager
  description: 第一版唯一获批的 Xray-core 按需插件
- name: Authentication
- name: Identity
- name: Authorization
- name: Audit
- name: NodeLifecycle
- name: Tasks
- name: AIEvents
paths:
  /api/v1/nodes:
    get:
      tags:
      - Nodes
      summary: 获取用户有权限访问的节点列表
      operationId: listNodesForTransfer
      parameters:
      - in: query
        name: onlineOnly
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: 节点列表
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/NodeSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/nodes/{nodeId}/files:
    parameters:
    - $ref: '#/components/parameters/NodeId'
    get:
      tags:
      - Files
      summary: 列出指定节点当前目录中的文件与文件夹
      operationId: listDirectory
      description: '只列当前目录，不递归；可在当前目录按文件名筛选、分页。

        系统不得通过符号链接访问到未授权目录。

        '
      parameters:
      - $ref: '#/components/parameters/PathQuery'
      - in: query
        name: search
        schema:
          type: string
          maxLength: 255
        description: 当前目录内的文件名筛选
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: 当前目录内容
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Offline'
    delete:
      tags:
      - Files
      summary: 删除文件或文件夹（高风险操作）
      operationId: deleteFile
      description: '要求 file.delete 权限。删除目录必须指定 recursive=true；

        系统路径是否允许删除由授权策略决定。需记录审计。

        '
      parameters:
      - $ref: '#/components/parameters/PathQuery'
      - in: query
        name: recursive
        required: true
        schema:
          type: boolean
      responses:
        '204':
          description: 删除完成
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/nodes/{nodeId}/files/size:
    parameters:
    - $ref: '#/components/parameters/NodeId'
    post:
      tags:
      - Files
      summary: 查询文件或目录大小
      operationId: calculateFileSize
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - path
              properties:
                path:
                  $ref: '#/components/schemas/AbsolutePath'
      responses:
        '200':
          description: 体积统计
          content:
            application/json:
              schema:
                type: object
                required:
                - path
                - sizeBytes
                properties:
                  path:
                    $ref: '#/components/schemas/AbsolutePath'
                  sizeBytes:
                    type: integer
                    minimum: 0
                  itemsScanned:
                    type: integer
                    minimum: 0
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/nodes/{nodeId}/files/directories:
    parameters:
    - $ref: '#/components/parameters/NodeId'
    post:
      tags:
      - Files
      summary: 在指定父目录下新建文件夹
      operationId: createDirectory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - parentPath
              - name
              properties:
                parentPath:
                  $ref: '#/components/schemas/AbsolutePath'
                name:
                  $ref: '#/components/schemas/EntryName'
      responses:
        '201':
          description: 文件夹创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileEntry'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/nodes/{nodeId}/files/rename:
    parameters:
    - $ref: '#/components/parameters/NodeId'
    patch:
      tags:
      - Files
      summary: 文件或文件夹重命名
      operationId: renameFile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - path
              - newName
              properties:
                path:
                  $ref: '#/components/schemas/AbsolutePath'
                newName:
                  $ref: '#/components/schemas/EntryName'
                expectedVersion:
                  type: string
                  description: 可选乐观锁版本
      responses:
        '200':
          description: 更新后的文件条目
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileEntry'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/nodes/{nodeId}/files/uploads:
    parameters:
    - $ref: '#/components/parameters/NodeId'
    post:
      tags:
      - Uploads
      summary: 为本地文件上传创建会话
      operationId: createUploadSession
      description: '创建会话只声明文件元数据，实际字节传输通道待技术设计阶段确定。

        文件大小限制与配额规则需后续产品确认。

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - destinationDir
              - files
              properties:
                destinationDir:
                  $ref: '#/components/schemas/AbsolutePath'
                conflictPolicy:
                  $ref: '#/components/schemas/ConflictPolicy'
                files:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                    - name
                    - sizeBytes
                    properties:
                      name:
                        $ref: '#/components/schemas/EntryName'
                      sizeBytes:
                        type: integer
                        minimum: 0
                      sha256:
                        type: string
                        pattern: ^[a-fA-F0-9]{64}$
      responses:
        '201':
          description: 上传会话元数据
          content:
            application/json:
              schema:
                type: object
                required:
                - uploadId
                - status
                properties:
                  uploadId:
                    type: string
                  status:
                    type: string
                    enum:
                    - awaiting_data
                  expiresAt:
                    type: string
                    format: date-time
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/nodes/{nodeId}/files/uploads/{uploadId}/complete:
    parameters:
    - $ref: '#/components/parameters/NodeId'
    - in: path
      name: uploadId
      required: true
      schema:
        type: string
    post:
      tags:
      - Uploads
      summary: 确认上传完成并请求校验
      operationId: completeUploadSession
      responses:
        '200':
          description: 上传校验结果
          content:
            application/json:
              schema:
                type: object
                required:
                - uploadId
                - status
                properties:
                  uploadId:
                    type: string
                  status:
                    type: string
                    enum:
                    - completed
                    - failed
                  files:
                    type: array
                    items:
                      $ref: '#/components/schemas/FileEntry'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/transfers:
    get:
      tags:
      - Transfers
      summary: 列出用户可见的文件传输任务
      operationId: listTransfers
      parameters:
      - in: query
        name: status
        schema:
          $ref: '#/components/schemas/TransferStatus'
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: limit
        schema:
          type: integer
          default: 50
          minimum: 1
          maximum: 200
      responses:
        '200':
          description: 传输任务列表
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TransferJob'
                  nextCursor:
                    type:
                    - string
                    - 'null'
    post:
      tags:
      - Transfers
      summary: 提交跨节点或跨目录的异步复制任务
      operationId: createTransfer
      description: '请求须验证源 file.read + 目标 file.write + file.transfer 权限。

        默认不跟随符号链接、不删除源文件。不能复制到自身或其下级目录。

        拒绝离线节点或无效目标目录；使用幂等键避免重复提交。

        '
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransferRequest'
      responses:
        '202':
          description: 已接受异步任务，不表示文件已经复制
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/transfers/{transferId}:
    parameters:
    - $ref: '#/components/parameters/TransferId'
    get:
      tags:
      - Transfers
      summary: 查询单次传输进度、状态及项目级结果
      operationId: getTransfer
      responses:
        '200':
          description: 传输任务详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferJob'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/transfers/{transferId}/cancel:
    parameters:
    - $ref: '#/components/parameters/TransferId'
    post:
      tags:
      - Transfers
      summary: 请求取消排队或执行中的传输任务
      operationId: cancelTransfer
      description: '取消是请求，不保证已复制的部分文件自动回滚；其保留/清理策略待产品确认。

        '
      responses:
        '202':
          description: 已受理取消请求
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferJob'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/dns/providers:
    get:
      tags:
      - DNSProviders
      summary: 列出首版支持的 DNS 供应商及其能力
      operationId: listDNSProviders
      responses:
        '200':
          description: 首版仅 cloudflare；未来可追加新供应商而不更改 DNS 管理概念
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DNSProvider'
  /api/v1/dns/accounts:
    get:
      tags:
      - DNSAccounts
      summary: 查询可见的 DNS 账号，不返回任何凭证明文
      operationId: listDNSAccounts
      responses:
        '200':
          description: 账号列表
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DNSAccount'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - DNSAccounts
      summary: 创建 DNS 供应商账号并安全提交 Cloudflare Token
      operationId: createDNSAccount
      description: 要求 dns.account.manage 权限。真实 Token 只可通过受保护的后端凭证入口接收，不得在响应/日志/审计原文中回显。原型不实现本端点。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDNSAccountRequest'
      responses:
        '201':
          description: 已创建；响应没有 apiToken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DNSAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/dns/accounts/{accountId}:
    parameters:
    - $ref: '#/components/parameters/DNSAccountId'
    get:
      tags:
      - DNSAccounts
      summary: 查看账号非敏感信息
      operationId: getDNSAccount
      responses:
        '200':
          description: 账号信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DNSAccount'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - DNSAccounts
      summary: 编辑账号名称、备注、启用状态
      operationId: updateDNSAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDNSAccountRequest'
      responses:
        '200':
          description: 保存账号，停用默认账号时须选择新的默认账号或置空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DNSAccount'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - DNSAccounts
      summary: 解除 Server Fleet 中的账号绑定，不删除真实 Cloudflare Zone/记录
      operationId: deleteDNSAccount
      responses:
        '204':
          description: 已删除绑定。历史审计保留策略另行确定
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/dns/accounts/{accountId}/credentials:
    parameters:
    - $ref: '#/components/parameters/DNSAccountId'
    put:
      tags:
      - DNSAccounts
      summary: 轮换 Cloudflare API Token（写入后端安全凭证存储）
      operationId: rotateDNSAccountCredential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - apiToken
              properties:
                apiToken:
                  type: string
                  format: password
                  writeOnly: true
                  minLength: 1
      responses:
        '204':
          description: 新凭证已安全托管，不返回原文
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/dns/accounts/{accountId}/default:
    parameters:
    - $ref: '#/components/parameters/DNSAccountId'
    put:
      tags:
      - DNSAccounts
      summary: 设置已启用的默认 DNS 账号（不跨账号合并 Zone/记录）
      operationId: setDefaultDNSAccount
      responses:
        '200':
          description: 默认账号变更成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DNSAccount'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/dns/accounts/{accountId}/test:
    parameters:
    - $ref: '#/components/parameters/DNSAccountId'
    post:
      tags:
      - DNSAccounts
      summary: 真实接入后验证 Token、Zone 读取、DNS 编辑权限
      operationId: testDNSConnection
      responses:
        '200':
          description: 实际权限检测结果；原型未调用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DNSConnectionTest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/ProviderError'
  /api/v1/dns/accounts/{accountId}/zones:
    parameters:
    - $ref: '#/components/parameters/DNSAccountId'
    get:
      tags:
      - DNSZones
      summary: 列出该 Cloudflare 账号可管理的 Zone
      operationId: listDNSZones
      responses:
        '200':
          description: 按账号隔离的 Zone 列表
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DNSZone'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/dns/accounts/{accountId}/zones/sync:
    parameters:
    - $ref: '#/components/parameters/DNSAccountId'
    post:
      tags:
      - DNSZones
      summary: 从 Cloudflare 同步账号可见的 Zone 清单
      operationId: syncDNSZones
      responses:
        '200':
          description: 已同步的账号 Zone 列表
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DNSZone'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          $ref: '#/components/responses/ProviderError'
