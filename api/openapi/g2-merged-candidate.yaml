components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieSession:
      type: apiKey
      in: cookie
      name: sf_session
  parameters:
    NodeId:
      in: path
      name: nodeId
      required: true
      schema:
        type: string
        minLength: 1
    TransferId:
      in: path
      name: transferId
      required: true
      schema:
        type: string
    DNSAccountId:
      in: path
      name: accountId
      required: true
      schema:
        type: string
        minLength: 1
    DNSZoneId:
      in: path
      name: zoneId
      required: true
      schema:
        type: string
        minLength: 1
    DNSRecordId:
      in: path
      name: recordId
      required: true
      schema:
        type: string
        minLength: 1
    GatewayRouteId:
      in: path
      name: routeId
      required: true
      schema:
        type: string
        minLength: 1
    PathQuery:
      in: query
      name: path
      required: true
      schema:
        $ref: '#/components/schemas/AbsolutePath'
    GatewayId:
      in: path
      name: gatewayId
      required: true
      schema:
        type: string
        minLength: 1
    GatewayProvisionJobId:
      in: path
      name: jobId
      required: true
      schema:
        type: string
        minLength: 1
    NotificationChannelId:
      in: path
      name: channel
      required: true
      schema:
        type: string
        enum:
        - smtp
        - qqbot
    PluginId:
      in: path
      name: pluginId
      required: true
      schema:
        type: string
        minLength: 1
    PluginOperationId:
      in: path
      name: operationId
      required: true
      schema:
        type: string
        minLength: 1
    EnrollmentId:
      in: path
      name: enrollmentId
      required: true
      schema:
        type: string
        minLength: 1
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 200
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: 资源 revision 对应的强 ETag，防止丢失更新
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: 同一主体+操作+请求摘要去重；相同 key 不同参数 409
    CSRF:
      name: X-CSRF-Token
      in: header
      required: false
      schema:
        type: string
      description: Cookie 会话变更操作必须提供；Bearer 请求不使用此字段
  schemas:
    DNSProvider:
      type: object
      required:
      - code
      - displayName
      - supported
      - capabilities
      properties:
        code:
          type: string
          enum:
          - cloudflare
        displayName:
          type: string
          examples:
          - Cloudflare
        supported:
          type: boolean
          const: true
        capabilities:
          type: object
          properties:
            supportsProxy:
              type: boolean
              description: Cloudflare 专属代理能力
            supportsZoneSync:
              type: boolean
            supportedRecordTypes:
              type: array
              items:
                type: string
    DNSAccount:
      type: object
      required:
      - id
      - providerCode
      - displayName
      - enabled
      - isDefault
      - credentialStatus
      properties:
        id:
          type: string
        providerCode:
          type: string
          enum:
          - cloudflare
        displayName:
          type: string
        note:
          type: string
        enabled:
          type: boolean
        isDefault:
          type: boolean
        credentialStatus:
          type: string
          enum:
          - not_configured
          - pending_verification
          - valid
          - invalid
          - missing_permissions
        zoneCount:
          type: integer
          minimum: 0
      description: 永不包含 apiToken、私钥或其他敏感凭证
    CreateDNSAccountRequest:
      type: object
      required:
      - providerCode
      - displayName
      - apiToken
      properties:
        providerCode:
          type: string
          const: cloudflare
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        note:
          type: string
          maxLength: 300
        enabled:
          type: boolean
          default: true
        apiToken:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          description: 只允许后端凭证服务接收，禁止响应回显和审计明文
    UpdateDNSAccountRequest:
      type: object
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        note:
          type: string
          maxLength: 300
        enabled:
          type: boolean
    DNSConnectionTest:
      type: object
      required:
      - status
      - zoneRead
      - recordWrite
      properties:
        status:
          type: string
          enum:
          - success
          - failed
          - partial
        zoneRead:
          type: boolean
        recordWrite:
          type: boolean
        message:
          type: string
          description: 脱敏的错误或状态说明
        checkedAt:
          type: string
          format: date-time
    DNSZone:
      type: object
      required:
      - id
      - accountId
      - name
      properties:
        id:
          type: string
          description: 应由后端唯一识别（可封装供应商 Zone ID）
        accountId:
          type: string
        name:
          type: string
          examples:
          - example.com
        status:
          type: string
    DNSRecordInput:
      type: object
      required:
      - type
      - name
      - content
      properties:
        type:
          type: string
          enum:
          - A
          - AAAA
          - CNAME
          - TXT
          - MX
        name:
          type: string
        content:
          type: string
        ttl:
          type: integer
          minimum: 1
          description: 由后端映射 Cloudflare 的自动 TTL 标记，具体取值须按供应商约束校验
        proxied:
          type: boolean
          description: 仅当供应商能力和记录类型支持时可用
        priority:
          type: integer
          minimum: 0
          description: MX 等记录按类型要求
    DNSRecord:
      allOf:
      - $ref: '#/components/schemas/DNSRecordInput'
      - type: object
        required:
        - id
        - zoneId
        properties:
          id:
            type: string
          zoneId:
            type: string
          modifiedAt:
            type: string
            format: date-time
    GatewayNode:
      type: object
      required:
      - id
      - nodeId
      - name
      - online
      - nginxInstalled
      - checksPassed
      - enabled
      - status
      - schedulingEligible
      properties:
        id:
          type: string
        nodeId:
          type: string
        name:
          type: string
        region:
          type: string
        countryCode:
          type: string
        online:
          type: boolean
        status:
          type: string
          enum:
          - pending
          - installing
          - verifying
          - ready
          - failed
          - maintenance
        nginxInstalled:
          type: boolean
        checksPassed:
          type: boolean
        enabled:
          type: boolean
        schedulingEligible:
          type: boolean
          readOnly: true
          description: 只在 online && ready && nginxInstalled && checksPassed && enabled 等条件均成立时可为 true
        lastError:
          type: string
        nginxVersion:
          type: string
    GatewayRouteInput:
      type: object
      required:
      - domain
      - https
      - enabled
      properties:
        domain:
          type: string
          examples:
          - app.example.com
        upstream:
          type: string
          examples:
          - node-01:8080
          description: 旧版后端字符串；与 serviceGroupId 只能二选一。
        https:
          type: boolean
        enabled:
          type: boolean
        serviceGroupId:
          type: string
          description: v0.5 新增：选择服务组作为路由后端；与 upstream 直接字符串互斥。
      oneOf:
      - required:
        - upstream
        not:
          required:
          - serviceGroupId
      - required:
        - serviceGroupId
        not:
          required:
          - upstream
    GatewayRoute:
      allOf:
      - $ref: '#/components/schemas/GatewayRouteInput'
      - type: object
        required:
        - id
        properties:
          id:
            type: string
    AbsolutePath:
      type: string
      pattern: ^/
      description: 使用经过校验和规范化的绝对路径；不允许 .. 越界和未经授权的符号链接解析
      examples:
      - /home/deploy
    EntryName:
      type: string
      minLength: 1
      maxLength: 255
      description: 不允许路径分隔符、NUL、单独的 . 和 ..
      examples:
      - deploy.sh
    NodeSummary:
      type: object
      required:
      - id
      - name
      - online
      properties:
        id:
          type: string
        name:
          type: string
        online:
          type: boolean
        region:
          type: string
        provider:
          type: string
        countryCode:
          type: string
          pattern: ^[A-Z]{2}$
          description: ISO 3166-1 alpha-2 国家/地区代码，用于显示国旗；缺失时显示通用地球图标
        ip:
          type: string
          description: 管理页面显示用途，按 RBAC 授权过滤
        tags:
          type: array
          items:
            type: string
        cpuPercent:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 100
        memoryPercent:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 100
    FileEntry:
      type: object
      required:
      - name
      - path
      - type
      properties:
        name:
          $ref: '#/components/schemas/EntryName'
        path:
          $ref: '#/components/schemas/AbsolutePath'
        type:
          type: string
          enum:
          - file
          - directory
          - symlink
        sizeBytes:
          type:
          - integer
          - 'null'
          minimum: 0
        modifiedAt:
          type:
          - string
          - 'null'
          format: date-time
        version:
          type:
          - string
          - 'null'
          description: 可用于防止源文件过期的版本标识
        permissions:
          type:
          - string
          - 'null'
    DirectoryList:
      type: object
      required:
      - nodeId
      - path
      - entries
      properties:
        nodeId:
          type: string
        path:
          $ref: '#/components/schemas/AbsolutePath'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/FileEntry'
        nextCursor:
          type:
          - string
          - 'null'
    ConflictPolicy:
      type: string
      enum:
      - skip
      - overwrite
      - rename
      default: skip
    CreateTransferRequest:
      type: object
      required:
      - sourceNodeId
      - sourcePaths
      - destinationNodeId
      - destinationDir
      - conflictPolicy
      properties:
        sourceNodeId:
          type: string
        sourcePaths:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AbsolutePath'
        destinationNodeId:
          type: string
        destinationDir:
          $ref: '#/components/schemas/AbsolutePath'
        conflictPolicy:
          $ref: '#/components/schemas/ConflictPolicy'
        followSymlinks:
          const: false
          default: false
        dryRun:
          type: boolean
          default: false
          description: 仅检查权限/冲突/空间，不执行复制；UI 暂未提供该按钮
    TransferStatus:
      type: string
      enum:
      - queued
      - running
      - completed
      - partial_failure
      - failed
      - cancelling
      - cancelled
    TransferItemResult:
      type: object
      required:
      - sourcePath
      - status
      properties:
        sourcePath:
          $ref: '#/components/schemas/AbsolutePath'
        destinationPath:
          $ref: '#/components/schemas/AbsolutePath'
        status:
          type: string
          enum:
          - queued
          - copying
          - copied
          - skipped
          - failed
          - cancelled
        bytesCopied:
          type: integer
          minimum: 0
        error:
          $ref: '#/components/schemas/Error'
    TransferJob:
      type: object
      required:
      - id
      - sourceNodeId
      - sourcePaths
      - destinationNodeId
      - destinationDir
      - status
      - progressPercent
      - createdAt
      properties:
        id:
          type: string
        sourceNodeId:
          type: string
        sourcePaths:
          type: array
          items:
            $ref: '#/components/schemas/AbsolutePath'
        destinationNodeId:
          type: string
        destinationDir:
          $ref: '#/components/schemas/AbsolutePath'
        conflictPolicy:
          $ref: '#/components/schemas/ConflictPolicy'
        status:
          $ref: '#/components/schemas/TransferStatus'
        progressPercent:
          type: number
          minimum: 0
          maximum: 100
        totalBytes:
          type:
          - integer
          - 'null'
          minimum: 0
        copiedBytes:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/TransferItemResult'
        createdAt:
          type: string
          format: date-time
        startedAt:
          type:
          - string
          - 'null'
          format: date-time
        completedAt:
          type:
          - string
          - 'null'
          format: date-time
        error:
          $ref: '#/components/schemas/Error'
    Error:
      type: object
