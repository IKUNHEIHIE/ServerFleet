      additionalProperties: false
  responses:
    Unauthorized:
      description: 未登录或无效凭证
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 权限不足或路径超出授权范围
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 节点或路径不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Offline:
      description: 节点离线
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 同名冲突、文件版本不一致、任务已结束或节点状态冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: 格式错误或必填字段缺失
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ProviderError:
      description: DNS 供应商暂时不可用、账号无效或上游接口返回错误；应脱敏展示原因
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: 请求格式正确，但路径或复制目标不允许
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: 配额限制或并发作业超限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ScopeDenied:
      description: 用户对当前 session/resource/operation 无权限；服务端拒绝，不能由客户端覆盖
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StaleScope:
      description: 资源授权已更新，scopeRevision 失效；旧任务和旧计划不能继续
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error400:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error401:
      description: Unauthenticated
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error403:
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error404:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error409:
      description: State conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error412:
      description: Revision mismatch
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error428:
      description: Precondition required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error429:
      description: Rate limited
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error503:
