          type: array
          items: *id031
          maxItems: 1000
        revision:
          type: integer
          minimum: 1
        planDigest: *id031
        expiresAt: *id032
      required:
      - taskId
      - state
      - createdAt
      - targetNodeIdsSnapshot
      - revision
      - planDigest
      additionalProperties: false
    TaskExecution:
      type: object
      properties:
        executionId: &id033
          type: string
        taskId: *id033
        nodeId: *id033
        state:
          type: string
          enum:
          - queued
          - waiting_node
          - offered
          - acknowledged
          - running
          - succeeded
          - failed
          - cancel_requested
          - canceled
          - timed_out
          - unknown
          - expired
        startedAt: &id034
          type: string
          format: date-time
        finishedAt: *id034
        exitCode:
          type:
          - integer
          - 'null'
        outputTruncated:
          type: boolean
        lastSequence:
          type: integer
          minimum: 0
      required:
      - executionId
      - taskId
      - nodeId
      - state
      - lastSequence
      additionalProperties: false
    TaskDecision:
      type: object
      properties:
        planDigest: &id035
          type: string
        decision:
          type: string
          enum:
          - approve
          - deny
        reason: *id035
      required:
      - planDigest
      - decision
      additionalProperties: false
    TaskAction:
      type: object
      properties:
        reason:
          type: string
        expectedRevision:
          type: integer
          minimum: 1
      required:
      - reason
      additionalProperties: false
    AIMessageInput:
      type: object
      properties:
        content:
          type: string
          maxLength: 32000
        clientMessageId:
          type: string
        scopeRevision:
          type: integer
          minimum: 0
      required:
      - content
      - clientMessageId
      - scopeRevision
      additionalProperties: false
    AIMessage:
      type: object
      properties:
        messageId: &id036
          type: string
        sessionId: *id036
        role:
          type: string
          enum:
          - user
          - assistant
          - tool
        redactedContent: *id036
        createdAt:
          type: string
          format: date-time
        taskIds:
          type: array
          items: *id036
      required:
      - messageId
      - sessionId
      - role
      - createdAt
      additionalProperties: false
    ListSessions:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        page:
          $ref: '#/components/schemas/PageMeta'
      required:
      - items
      - page
      additionalProperties: false
    PageOfUser:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          $ref: '#/components/schemas/PageMeta'
      required:
      - items
      - page
      additionalProperties: false
    PageOfGrant:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Grant'
        page:
          $ref: '#/components/schemas/PageMeta'
      required:
      - items
      - page
      additionalProperties: false
    PageOfAuditEvent:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        page:
          $ref: '#/components/schemas/PageMeta'
      required:
      - items
      - page
      additionalProperties: false
    PageOfTaskSummary:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaskSummary'
        page:
          $ref: '#/components/schemas/PageMeta'
      required:
      - items
      - page
      additionalProperties: false
    PageOfTaskExecution:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaskExecution'
        page:
          $ref: '#/components/schemas/PageMeta'
      required:
      - items
      - page
      additionalProperties: false
    PageOfAIMessage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AIMessage'
        page:
          $ref: '#/components/schemas/PageMeta'
      required:
      - items
      - page
      additionalProperties: false
    RoleList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Role'
      required:
      - items
      additionalProperties: false
    PermissionList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
      required:
