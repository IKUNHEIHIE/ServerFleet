    parameters:
    - name: monitorId
      in: path
      required: true
      schema:
        type: string
  /api/v1/nodes/{nodeId}/traffic-quota:
    get:
      operationId: getObservedTrafficQuota
      summary: Read actual current usage or missing data and sampling coverage
      tags:
      - Observability
      description: Current session and module permissions required. Writes require
