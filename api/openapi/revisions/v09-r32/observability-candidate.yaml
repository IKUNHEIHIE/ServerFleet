openapi: 3.0.3
info:
  title: Server Fleet R32 Continuous Monitoring and Notification Candidate
  version: 0.9.32
  description: Independent additive candidate, not a G2 freeze. See docs/contracts/revisions/v09-r32-observability.md.
  license:
    name: Private project
servers:
- url: https://controller.example.invalid
security:
- sessionCookie: []
tags:
- name: Observability
  description: Durable alerts, observed host traffic and task-backed notification
    delivery
paths:
  /api/v1/availability-monitors:
    get:
      operationId: listBackgroundMonitors
      summary: Read monitor configuration, thresholds and ownership
      tags:
      - Observability
      description: Current session and module permissions required. Writes require
        same-origin CSRF. Strict JSON; no direct Agent or credential access.
      responses:
        '200':
          description: Current authorized result, no-store
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Monitor'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Current authority, origin or CSRF denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource absent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict or nonretryable result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createBackgroundMonitor
      summary: Create Controller-local monitor and owner grant
      tags:
      - Observability
      description: Current session and module permissions required. Writes require
        same-origin CSRF. Strict JSON; no direct Agent or credential access.
      responses:
        '201':
          description: Current authorized result, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Current authority, origin or CSRF denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource absent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict or nonretryable result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitorInput'
  /api/v1/availability-monitors/{monitorId}:
    patch:
      operationId: updateBackgroundMonitor
      summary: Update configuration and current owner revision
      tags:
      - Observability
      description: Current session and module permissions required. Writes require
        same-origin CSRF. Strict JSON; no direct Agent or credential access.
      responses:
        '200':
          description: Current authorized result, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Current authority, origin or CSRF denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource absent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict or nonretryable result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitorInput'
    delete:
      operationId: deleteBackgroundMonitor
      summary: Delete monitor; stale outbox intents fail current-source checks
      tags:
      - Observability
      description: Current session and module permissions required. Writes require
        same-origin CSRF. Strict JSON; no direct Agent or credential access.
      responses:
        '200':
          description: Current authorized result, no-store
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Current authority, origin or CSRF denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource absent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict or nonretryable result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    parameters:
    - name: monitorId
      in: path
      required: true
      schema:
        type: string
  /api/v1/availability-monitors/{monitorId}/alerts:
    get:
      operationId: listMonitorAlertEvents
      summary: Read latest 20 persisted transition alerts and actual delivery task
      tags:
      - Observability
      description: Current session and module permissions required. Writes require
        same-origin CSRF. Strict JSON; no direct Agent or credential access.
      responses:
        '200':
          description: Current authorized result, no-store
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AlertEvent'
                required:
                - items
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Current authority, origin or CSRF denied
          content:
            application/json:
              schema:
