# Include inside the http {} block; replace paths and names for your deployment.
server {
    listen 443 ssl;
    server_name panel.example.com;
    ssl_protocols TLSv1.3;
    ssl_certificate /etc/nginx/tls/panel-chain.pem;
    ssl_certificate_key /etc/nginx/tls/panel-key.pem;
    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_set_header Host $http_host;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.3;
        proxy_ssl_name panel.example.com;
        proxy_ssl_trusted_certificate /etc/nginx/tls/controller-ca.pem;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
