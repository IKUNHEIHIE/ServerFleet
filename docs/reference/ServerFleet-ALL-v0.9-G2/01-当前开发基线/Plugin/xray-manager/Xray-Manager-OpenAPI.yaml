components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    XrayNodeRef:
      type: object
      properties:
        nodeId:
          type: string
        name:
          type: string
        online:
          type: boolean
        provider:
          type: string
        region:
          type: string
        arch:
          type: string
        xrayDetected:
          type: boolean
        managed:
          type: boolean
      additionalProperties: false
      required:
      - nodeId
      - name
      - online
      - managed
    XrayTargetSelector:
      type: object
      properties:
        nodeIds:
          type: array
          items:
            type: string
        serviceGroupId:
          type: string
          description: 可选服务组，提交时必须固化具体节点快照
        targetNodeIdsSnapshot:
          type: array
          items:
            type: string
      additionalProperties: false
      required:
      - nodeIds
      description: nodeIds 显式数组，允许来自服务组选择器的已解析快照；提交时服务端再次解析、比对和逐目标鉴权。
    XrayBatchPolicy:
      type: object
      properties:
        mode:
          type: string
          enum:
          - normal
          - batch
          - canary
        batchSize:
          type: integer
          minimum: 1
        concurrency:
          type: integer
          minimum: 1
        maxFailures:
          type: integer
          minimum: 0
        stopOnHealthFailure:
          type: boolean
        expiresAt:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - mode
      - concurrency
      - maxFailures
    XrayInstance:
      type: object
      properties:
        nodeId:
          type: string
        managed:
          type: boolean
        adoptionState:
          type: string
          enum:
          - none
          - detected_unmanaged
          - pending_approval
          - managed
        version:
          type: string
        serviceStatus:
          type: string
          enum:
          - not_installed
          - running
          - stopped
          - failed
          - unknown
        architecture:
          type: string
        configRevision:
          type: integer
          minimum: 0
        configHash:
          type: string
        inboundCount:
          type: integer
          minimum: 0
        apiListeningAddress:
          type: string
          description: 必须为 127.0.0.1 或 ::1
        lastHealthCheckAt:
          type: string
          format: date-time
        lastError:
          type: string
      additionalProperties: false
      required:
      - nodeId
      - managed
      - serviceStatus
    XrayTemplate:
      type: object
      properties:
        templateId:
          type: string
          enum:
          - vless-tls-vision
          - vless-reality-vision
          - custom-json
        name:
          type: string
        flow:
          type: string
          description: 标准模板的用户级 flow 通常为 xtls-rprx-vision
        security:
          type: string
          enum:
          - tls
          - reality
          - custom
        supportedVersions:
          type: array
          items:
            type: string
        requiredParameters:
          type: array
          items:
            type: string
        references:
          type: array
          items:
            type: string
      additionalProperties: false
      required:
      - templateId
      - name
      - security
    XrayValidationIssue:
      type: object
      properties:
        code:
          type: string
        severity:
          type: string
          enum:
          - error
          - warning
          - info
        nodeId:
          type: string
        fieldPath:
          type: string
        message:
          type: string
        suggestion:
          type: string
      additionalProperties: false
      required:
      - code
      - severity
      - message
    XrayInstallationPreviewRequest:
      type: object
      properties:
        targets:
          $ref: '#/components/schemas/XrayTargetSelector'
        targetVersion:
          type: string
          description: 固定的具体 Xray release 版本
        manageExisting:
          type: boolean
        port:
          type: integer
          minimum: 1
          maximum: 65535
        batchPolicy:
          $ref: '#/components/schemas/XrayBatchPolicy'
      additionalProperties: false
      required:
      - targets
      - targetVersion
      - batchPolicy
    XrayNodeCheck:
      type: object
      properties:
        nodeId:
          type: string
        eligible:
          type: boolean
        existingInstallation:
          type: boolean
        hasPortConflict:
          type: boolean
        architecture:
          type: string
        diskEnough:
          type: boolean
        issues:
          type: array
          items:
            $ref: '#/components/schemas/XrayValidationIssue'
        currentVersion:
          type: string
      additionalProperties: false
      required:
      - nodeId
      - eligible
      - issues
    XrayPreview:
      type: object
      properties:
        previewId:
          type: string
        expiresAt:
          type: string
          format: date-time
        targetNodeIdsSnapshot:
          type: array
          items:
            type: string
        checks:
          type: array
          items:
            $ref: '#/components/schemas/XrayNodeCheck'
        eligible:
          type: boolean
