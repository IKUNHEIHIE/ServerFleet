openapi: 3.1.0
info:
  title: Server Fleet — Xray 节点管理器插件 API
  version: 0.9.0-draft
  description: 首版唯一已批准的官方可选插件。API 仅为设计契约，不调用真实 Xray 或云节点。所有写操作由受控 Agent 执行，不能绕过主控 RBAC、AI 会话资源授权、审批、任务幂等、审计与凭据隔离。
servers:
- url: https://controller.example.invalid
  description: 占位符，非真实运行 API
security:
- bearerAuth: []
tags:
- name: Xray Manager
  description: Xray-core 节点、模板、配置、用户、流量及批量安装
paths:
  /api/v1/plugins/xray-manager/capabilities:
    get:
      tags:
      - Xray Manager
      summary: 插件能力、支持版本与模板
      operationId: xrayGetCapabilities
      description: 返回支持的模板清单、目标版本兼容矩阵、Xray 官方 Release 校验信息。响应类型为示意，正式实现应使用数组容器。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/XrayTemplate'
                  nextCursor:
                    type: string
                required:
                - items
        '400':
          description: 无效请求
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XrayError'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XrayError'
        '403':
          description: 无权限或会话资源范围不包含目标
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XrayError'
        '404':
          description: 资源不存在或不在可见范围
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XrayError'
        '409':
          description: 实例/配置版本冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XrayError'
        '422':
          description: 预检查、校验或安全策略拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XrayError'
  /api/v1/plugins/xray-manager/nodes:
    get:
      tags:
      - Xray Manager
      summary: 列出当前用户可管理的 Xray 节点与安装状态
      operationId: xrayListNodes
      description: 仅通过 Server Fleet Controller 后端鉴权和 Agent 受控操作执行；受用户资源权限、AI 会话范围（若适用）、审批、审计与节点状态约束。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/XrayNodeRef'
                  nextCursor:
