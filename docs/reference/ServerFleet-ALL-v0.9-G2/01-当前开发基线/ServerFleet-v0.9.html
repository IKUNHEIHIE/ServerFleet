function ftCalc(nodeId,path,name){let all=S.fileSystems[nodeId]||{},entry=ftFiles(nodeId,path).find(f=>f.name===name);if(!entry)return 0;if(entry.type!=='dir')return entry.size||0;let root=ftJoin(path,name);return Object.keys(all).filter(k=>k===root||k.startsWith(root+'/')).reduce((n,k)=>n+(all[k]||[]).reduce((m,f)=>m+(f.type==='file'?(f.size||0):0),0),0)}
function ftJobFinish(job){if(job.status==='已取消')return;let fromFs=S.fileSystems[job.from],toFs=S.fileSystems[job.to];if(!node(job.from)?.online||!node(job.to)?.online){job.status='失败';job.error='节点离线';return}let origin=fromFs[normalizeFtPath(job.src)];if(!origin){job.status='失败';job.error='源目录已不存在';return}let target=toFs[normalizeFtPath(job.dest)]||(toFs[normalizeFtPath(job.dest)]=[]),copied=0;for(const name of job.names){let item=origin.find(f=>f.name===name);if(!item){job.status='失败';job.error='源文件已变更：'+name;continue}if(item.type==='link'){job.status='失败';job.error='符号链接暂不支持传输';continue}let same=target.find(f=>f.name===name),newName=name;if(same){if(job.conflict==='skip')continue;if(job.conflict==='rename'){let i=1,base=name.replace(/(\.[^.]+)$/,'');let ext=name.slice(base.length);while(target.some(f=>f.name===newName)){newName=base+'-副本'+i+ext;i++}}else {target.splice(target.indexOf(same),1);if(same.type==='dir'){let prefix=ftJoin(job.dest,name);for(const k of Object.keys(toFs)){if(k===prefix||k.startsWith(prefix+'/'))delete toFs[k]}}}}let fresh={...item,name:newName,mtime:'刚刚'};target.push(fresh);if(item.type==='dir'){let srcPrefix=ftJoin(job.src,name),dstPrefix=ftJoin(job.dest,newName);toFs[dstPrefix]=[];for(const k of Object.keys(fromFs).filter(k=>k===srcPrefix||k.startsWith(srcPrefix+'/')).sort((a,b)=>a.length-b.length)){let destKey=dstPrefix+k.slice(srcPrefix.length);toFs[destKey]=JSON.parse(JSON.stringify(fromFs[k]))}}copied++}if(copied){job.status='已完成';job.progress=100;log('文件互传完成',`${node(job.from)?.name||job.from} → ${node(job.to)?.name||job.to} · ${copied} 项`)}else if(job.status!=='失败'){job.status='已完成';job.progress=100} }
function ftRunJob(id){let job=S.transferJobs.find(j=>j.id===id);if(!job||!['排队中','传输中'].includes(job.status))return;job.status='传输中';job.progress=65;save();if(S.page==='filetransfer')render();setTimeout(()=>{let current=S.transferJobs.find(j=>j.id===id);if(!current||current.status!=='传输中')return;ftJobFinish(current);save();if(S.page==='filetransfer')render()},850)}

function createTaskBase(){let name=V('tname').trim(),content=V('tcontent').trim();if(!name||!content){toast('请填写任务名称与内容');return}let raw=V('ttarget'),ids=[],target='';if(raw.startsWith('sg:')){let g=serviceById(raw.slice(3));if(!g){toast('服务组不存在');return}ids=[...g.members];target='服务组：'+g.name}else if(raw.startsWith('grp:')){let g=S.groups.find(g=>g.id===raw.slice(4));ids=g?[...g.members]:[];target='节点分组：'+(g?.name||'未知')}else if(raw==='all'){ids=S.nodes.filter(n=>n.online).map(n=>n.id);target='所有在线节点'}else if(raw==='selected'){ids=[...S.selected];target='当前选中节点'}else{ids=[raw.slice(5)];target=node(ids[0])?.name||'节点'}ids=ids.filter(id=>!!node(id));let count=ids.length;if(!count){toast('目标中没有有效节点');return}S.tasks.unshift({id:'T-'+(1004+S.tasks.length),name,target,content,targetNodeIdsSnapshot:ids,count,done:count,status:V('tmode')==='等待审批'?'等待审批':CK('tdry')?'预演完成':'成功',time:'刚刚'});log('创建批量任务',target);closeModal();render();toast('已生成 '+count+' 台目标节点快照（模拟）')}

function dnsProviderSettings(){ensureDNS();let rows=S.dnsAccounts.map(a=>`<tr><td><b>${E(a.name)}</b><div class="tiny muted">${E(a.note||'无备注')}</div></td><td>${tag('Cloudflare','blue')}</td><td>${a.enabled?tag('已启用','green'):tag('已停用','orange')} ${tag('未连接真实 API')}</td><td>${a.isDefault?tag('默认账号','green'):btn('设为默认',`setDefaultDNSAccount('${a.id}')`,'sm')}</td><td>${S.dnsZones.filter(z=>z.accountId===a.id).length}</td><td>${btn('编辑',`modalDNSAccount('${a.id}')`,'sm')}${btn('模拟检查',`testDNSAccount('${a.id}')`,'sm')}${btn(a.enabled?'停用':'启用',`toggleDNSAccount('${a.id}')`,'sm')}${btn('删除',`deleteDNSAccountAsk('${a.id}')`,'sm danger')}</td></tr>`).join('');

}
function modalDNSAccount(id){let a=id?S.dnsAccounts.find(x=>x.id===id):{name:'',note:'',enabled:true};if(!a)return;
 modalOpen(id?'编辑 DNS 供应商账号':'新增 DNS 供应商账号',`<div class="field"><label>DNS 供应商</label><select disabled><option>Cloudflare（第一版唯一支持）</option></select></div>${formField('账号显示名称','dnsaName','text',a.name,'例如：Cloudflare 主账号')}${formField('备注','dnsaNote','text',a.note||'','例如：个人域名')}
 <label class="checkbox-label"><input type="checkbox" id="dnsaEnabled" ${a.enabled?'checked':''}> 启用此账号</label><div class="field"><label>API Token（真实接入阶段使用）</label><input type="password" disabled placeholder="纯前端原型不收集或保存真实凭证"></div><div class="help">未来的真实接入应仅向安全的后端凭证服务提交 Token；不可在浏览器持久存储、日志或接口响应中回显明文凭证。</div>`,ok(id?'保存账号':'创建演示账号',`saveDNSAccount('${id||''}')`));
}
function saveDNSAccount(id){let name=V('dnsaName').trim(),note=V('dnsaNote').trim(),enabled=CK('dnsaEnabled');if(!name){toast('请输入账号名称');return}if(S.dnsAccounts.some(a=>a.id!==id&&a.name===name)){toast('账号名称已存在');return}if(id){let a=S.dnsAccounts.find(a=>a.id===id);a.name=name;a.note=note;a.enabled=enabled;if(!enabled)a.isDefault=false;}else S.dnsAccounts.push({id:'dnsacc'+Date.now(),name,provider:'cloudflare',note,enabled,isDefault:false,verified:false});ensureDNS();log(id?'编辑 DNS 供应商账号':'新增 DNS 供应商账号',name);closeModal();render();toast('已保存演示账号（未连接真实 Cloudflare）')}
function setDefaultDNSAccount(id){let a=S.dnsAccounts.find(a=>a.id===id);if(!a||!a.enabled){toast('只有已启用账号可以设为默认');return}S.dnsAccounts.forEach(x=>x.isDefault=x.id===id);log('设置默认 DNS 供应商账号',a.name);save();render()}
function toggleDNSAccount(id){let a=S.dnsAccounts.find(a=>a.id===id);if(!a)return;a.enabled=!a.enabled;if(!a.enabled)a.isDefault=false;ensureDNS();log(a.enabled?'启用 DNS 供应商账号':'停用 DNS 供应商账号',a.name);save();render()}
function testDNSAccount(id){let a=S.dnsAccounts.find(a=>a.id===id);if(!a)return;modalOpen('连接检查（模拟）',`<div class="help">账号：<b>${E(a.name)}</b>（Cloudflare）</div><p>本原型不接收 API Token，不连接 Cloudflare，也不会伪造「已验证」结果。</p><p>正式接入后，本页面将测试凭证有效性、Zone 读取权限和 DNS 编辑权限，并明确显示成功、失败或权限不足。</p>`,btn('关闭','closeModal()'))}
function deleteDNSAccountAsk(id){let a=S.dnsAccounts.find(a=>a.id===id);if(!a)return;const count=S.dnsZones.filter(z=>z.accountId===id).length;confirmBox('删除演示 DNS 供应商账号',`将删除账号「${E(a.name)}」，并从本地演示数据中移除它的 ${count} 个域名及关联记录。其他账号不受影响。`,`deleteDNSAccount('${id}')`)}
function deleteDNSAccount(id){let a=S.dnsAccounts.find(a=>a.id===id);if(!a)return;let zIds=S.dnsZones.filter(z=>z.accountId===id).map(z=>z.id);S.dns=S.dns.filter(r=>!zIds.includes(r.zoneId));S.dnsZones=S.dnsZones.filter(z=>z.accountId!==id);S.dnsAccounts=S.dnsAccounts.filter(x=>x.id!==id);ensureDNS();log('删除演示 DNS 供应商账号',a.name);closeModal();render()}
function chooseDNSAccount(id){if(!S.dnsAccounts.some(a=>a.id===id&&a.enabled))return;S.dnsActiveAccount=id;S.dnsActiveZone=S.dnsZones.find(z=>z.accountId===id)?.id||'';save();render()}
function chooseDNSZone(id){if(!S.dnsZones.some(z=>z.id===id&&z.accountId===S.dnsActiveAccount))return;S.dnsActiveZone=id;save();render()}
function modalDNSZone(){let a=S.dnsAccounts.find(x=>x.id===S.dnsActiveAccount);if(!a||!a.enabled){toast('请先配置已启用的 DNS 账号');return}modalOpen('添加演示域名',`<div class="help">只在本地创建虚构域名条目；正式产品的域名列表将从所选 Cloudflare 账号拉取，不会在此自动创建实际 DNS Zone。</div>${formField('域名','dnsZoneName','text','','例如：demo.example.org')}`,ok('添加演示域名','saveDNSZone()'))}
function saveDNSZone(){let name=V('dnsZoneName').trim().toLowerCase();if(!/^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$/.test(name)){toast('请输入有效的域名');return}if(S.dnsZones.some(z=>z.accountId===S.dnsActiveAccount&&z.name===name)){toast('该账号已有此域名');return}let z={id:'zone'+Date.now(),accountId:S.dnsActiveAccount,name};S.dnsZones.push(z);S.dnsActiveZone=z.id;log('添加演示 DNS 域名',name);closeModal();render()}
function modalDNS(id){ensureDNS();let zone=S.dnsZones.find(z=>z.id===S.dnsActiveZone&&z.accountId===S.dnsActiveAccount);if(!zone){toast('请先选择一个 DNS 账号及域名');return}let d=id?S.dns.find(x=>x.id===id&&x.zoneId===zone.id):{type:'A',host:'',value:'',ttl:'自动',proxy:false};if(!d)return;
 modalOpen(id?'编辑 DNS 记录':'添加 DNS 记录',`<div class="help">当前域名：<b>${E(zone.name)}</b>。仅修改所选账号、所选域名的本地模拟记录。</div><div class="field"><label>记录类型</label><select id="dtype">${['A','AAAA','CNAME','TXT','MX'].map(v=>`<option ${d.type===v?'selected':''}>${v}</option>`).join('')}</select></div>${formField('主机名','dhost','text',d.host,'例如：www')}${formField('记录值','dvalue','text',d.value,'例如：203.0.113.10')}<div class="field"><label>TTL</label><select id="dttl">${['自动','300','600','3600'].map(v=>`<option ${d.ttl===v?'selected':''}>${v}</option>`).join('')}</select></div><label class="checkbox-label"><input type="checkbox" id="dproxy" ${d.proxy?'checked':''}> Cloudflare 代理（仅 A / AAAA / CNAME）</label>`,ok(id?'保存更改':'添加记录',`saveDNS('${id||''}')`))}

function saveDNS(id){let zone=S.dnsZones.find(z=>z.id===S.dnsActiveZone&&z.accountId===S.dnsActiveAccount);if(!zone){toast('目标域名不存在');return}let host=V('dhost').trim(),value=V('dvalue').trim(),type=V('dtype');if(!host||!value){toast('请输入主机名与记录值');return}let d={id:id||'d'+Date.now(),zoneId:zone.id,type,host,value,proxy:['A','AAAA','CNAME'].includes(type)&&CK('dproxy'),ttl:V('dttl')};if(id){if(!S.dns.some(x=>x.id===id&&x.zoneId===zone.id)){toast('无权编辑其他域名的记录');return}S.dns=S.dns.map(x=>x.id===id?d:x)}else S.dns.push(d);log(id?'修改 DNS 记录':'新增 DNS 记录',host+'.'+zone.name);closeModal();render()}

function createBackup(){modalOpen('创建模拟备份',`${formField('备份名称','bname','text','手动备份 '+new Date().toLocaleDateString('zh-CN'))}<div class="field"><label>范围</label><select id="btype"><option>配置</option><option>数据</option><option>配置 + 数据</option></select></div>`,ok('创建备份','addBackup()'))}

const csvEsc=x=>'"'+String(x??'').replace(/"/g,'""')+'"';function exportAudit(){let csv='时间,用户,操作,目标,结果\n'+S.audit.map(a=>[a.time,a.user,a.action,a.target,a.status].map(csvEsc).join(',')).join('\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='server-fleet-demo-audit.csv';a.click();URL.revokeObjectURL(a.href);toast('已导出模拟审计 CSV')}
function askAI(text){let q=(text||V('aiInput')).trim();if(!q)return;S.chat.push({who:'me',text:q});let answer='这是一个交互原型，没有连接 AI 模型。你可以继续修改功能设计。';if(/离线|故障/.test(q)){let ns=S.nodes.filter(n=>!n.online);answer=`当前找到 ${ns.length} 台离线节点：\n${ns.map(n=>'• '+n.name+' ('+n.region+')').join('\n')}\n\n建议先查看监控和连接记录。`;S.pendingAI=null}else if(/更新|升级|重启|部署|安装/.test(q)){answer='已生成模拟执行方案。请在右侧检查目标范围并确认。';S.pendingAI={summary:'批量检查并更新在线服务器（演示）',target:'全部在线节点 '+S.nodes.filter(n=>n.online).length+' 台',action:'检查更新 → 分批执行 → 汇总结果（模拟）'}}else if(/流量|带宽/.test(q)){let arr=[...S.nodes].sort((a,b)=>b.traffic-a.traffic).slice(0,3);answer='本月流量用量前三：\n'+arr.map((n,i)=>`${i+1}. ${n.name}：${n.traffic}/${n.quota} GB`).join('\n');S.pendingAI=null}else if(/CPU|内存|状态|服务器/.test(q)){answer=`系统目前有 ${S.nodes.length} 台节点，其中 ${S.nodes.filter(n=>n.online).length} 台在线。你可以打开「节点管理」查看详细状态。`;S.pendingAI=null}S.chat.push({who:'bot',text:answer});save();render();let ch=document.getElementById('chat');if(ch)ch.scrollTop=ch.scrollHeight}

function ftFileActions(side,name){let u=ftSide(side),f=ftFiles(u.node,u.path).find(x=>x.name===name);if(!f)return;modalOpen('文件操作：'+E(name),`<div class="keyval"><span>类型</span><b>${E(f.type==='dir'?'文件夹':f.type==='link'?'符号链接':'普通文件')}</b></div><div class="keyval"><span>完整路径</span><b>${E(ftJoin(u.path,f.name))}</b></div><div class="keyval"><span>大小</span><b>${E(ftSize(f.type==='dir'?ftCalc(u.node,u.path,name):f.size))}</b></div><div class="keyval"><span>最后修改</span><b>${E(f.mtime||'—')}</b></div>`,btn('关闭','closeModal()')+btn('重命名',`ftRenameAsk('${side}','${ftEncode(name)}')`)+btn('删除',`ftDeleteAsk('${side}','${ftEncode(name)}')`,'danger'))}
function ftDeleteReal(side,name){let u=ftSide(side),arr=ftFiles(u.node,u.path),idx=arr.findIndex(f=>f.name===name);if(idx<0)return;let p=ftJoin(u.path,name);arr.splice(idx,1);for(const k of Object.keys(S.fileSystems[u.node]||{})){if(k===p||k.startsWith(p+'/'))delete S.fileSystems[u.node][k]}u.selected=u.selected.filter(x=>x!==name);log('删除模拟文件',node(u.node).name+':'+p);closeModal();render()}
function ftUploadForm(side){let u=ftSide(side);modalOpen('上传文件到：'+E(node(u.node).name),`<div class="help">选择本机文件后，只读取文件名和大小并添加到模拟目录，不读取或传输文件内容。</div><div class="field"><label>选择本机文件（可多选）</label><input id="ftLocalFiles" type="file" multiple></div><div class="keyval"><span>目标目录</span><b>${E(u.path)}</b></div>`,ok('模拟上传',`ftUploadApply('${side}')`))}


// v0.4 local-only migration and feature state; intentionally no network calls or credential persistence.
function ensureV04(){if(S.v04Migrated)return;
 if(!Array.isArray(S.plugins))S.plugins=initial().plugins;
 S.plugins.forEach(p=>{if(typeof p.installed!=='boolean')p.installed=false;if(typeof p.enabled!=='boolean')p.enabled=false;if(!Array.isArray(p.permissions))p.permissions=[]});
 S.pluginRepo={mode:'official',url:'',ref:'main',folder:'Plugin'};
 S.pluginEvents=[];
 S.nodeNavOpen=true;
 S.gatewayNodes=[{id:'gw-demo1',nodeId:'n2',status:'就绪',nginxInstalled:true,checksPassed:true,enabled:true,version:'Nginx · 演示已验证',error:'',checkNote:'演示预设：Nginx、服务运行、配置检查通过'}];
 S.notifications={smtp:{enabled:false,host:'smtp.example.invalid',port:'465',security:'SSL/TLS',sender:'',recipient:'',hasSecret:false},qq:{enabled:false,appId:'',targetType:'私聊',targetId:'',hasSecret:false},fallback:true,logs:[]};
 S.v04Migrated=true;S.settings.notifyEmail=false;delete S.settings.notifyTelegram;save();}
// v0.8 documentation revision: remove all six legacy demo plugin entries, including from persisted browser state.
// Keep the generic plugin manager, repository configuration and future third-party entries unchanged.
function ensurePluginCatalogClean(){
 if(S.v08DemoPluginsRemoved)return;
 const legacyIds=new Set(['p1','p2','p3','p4','p5','p6']);
 const legacyNames=new Set(['文件工具增强','Docker 管理','Nginx 工具增强','流量分析','安全巡检','自定义插件']);
 if(!Array.isArray(S.plugins))S.plugins=[];
 S.plugins=S.plugins.filter(p=>!legacyIds.has(p.id)&&!legacyNames.has(p.name));
 if(!Array.isArray(S.pluginEvents))S.pluginEvents=[];
 S.pluginEvents=S.pluginEvents.filter(e=>!legacyNames.has(e.name));
 if(typeof S.page==='string'&&/^plugin-p[1-6]$/.test(S.page))S.page='plugins';
 S.v08DemoPluginsRemoved=true;
 save();
}
function gatewayEligible(g){return !!(g&&g.enabled&&g.status==='就绪'&&g.nginxInstalled&&g.checksPassed&&node(g.nodeId)?.online)}
function gatewayCreateModal(){let eligible=S.nodes.filter(n=>n.online&&!S.gatewayNodes.some(g=>g.nodeId===n.id));let options=eligible.map(n=>`<option value="${E(n.id)}">${regionFlag(n.region)} ${E(n.name)} · ${E(n.region)} · ${E(n.provider)}</option>`).join('');modalOpen('新建网关 · 选择在线节点',`<div class="help">选择一台在线、尚未登记为网关的节点。正式产品会询问安装授权，并检查 Nginx 是否存在；安装与验证全部成功后才能参与调度。此处不执行任何命令。</div>${eligible.length?`<div class="field"><label>目标节点</label><select id="gwNode">${options}</select></div><div class="gateway-step"><b>拟执行步骤（演示）</b><p class="tiny muted">检查系统 → 检测现有 Nginx → 根据确认安装 → 检查服务运行及配置 → 允许手动启用调度</p></div><div class="field"><label class="checkbox-label"><input type="checkbox" id="gwConsent">我已了解真实安装可能修改目标服务器的软件与服务配置</label></div>`:'<div class="empty">没有可用的在线节点。请先添加节点，或处理已存在网关。</div>'}`,eligible.length?ok('创建模拟安装任务','gatewayBegin()'):btn('关闭','closeModal()'))}
function gatewayBegin(){let id=V('gwNode');if(!CK('gwConsent')){toast('请先确认安装影响');return}if(!node(id)?.online||S.gatewayNodes.some(g=>g.nodeId===id)){toast('节点不满足安装条件');return}let g={id:'gw'+Date.now(),nodeId:id,status:'安装中',nginxInstalled:false,checksPassed:false,enabled:false,version:'待检查',error:'',checkNote:'等待演示检测'};S.gatewayNodes.push(g);log('创建模拟网关安装任务',node(id).name);closeModal();render();toast('已创建模拟安装任务，等待结果验证')}
function gatewayInstallSuccess(id){let g=S.gatewayNodes.find(x=>x.id===id);if(!g||g.status!=='安装中')return;g.nginxInstalled=true;g.checksPassed=true;g.status='就绪';g.enabled=true;g.version='Nginx · 演示安装成功';g.error='';g.checkNote='模拟：版本、服务运行、配置测试及健康检查全部通过';log('网关模拟安装并检查通过',node(g.nodeId)?.name||id);render();toast('网关已就绪并允许参与模拟调度')}
function gatewayInstallFail(id){let g=S.gatewayNodes.find(x=>x.id===id);if(!g||g.status!=='安装中')return;g.status='失败';g.nginxInstalled=false;g.checksPassed=false;g.enabled=false;g.error='模拟 Nginx 安装失败：依赖不可用';log('网关模拟安装失败',node(g.nodeId)?.name||id,'失败');render()}
function gatewayRetry(id){let g=S.gatewayNodes.find(x=>x.id===id);if(!g||g.status!=='失败')return;if(!node(g.nodeId)?.online){toast('节点离线，无法重试');return}g.status='安装中';g.error='';g.nginxInstalled=false;g.checksPassed=false;g.enabled=false;log('重试模拟网关安装',node(g.nodeId).name);render()}
function gatewayToggle(id){let g=S.gatewayNodes.find(x=>x.id===id);if(!g||g.status!=='就绪'||!g.nginxInstalled||!g.checksPassed)return;if(!g.enabled&&!node(g.nodeId)?.online){toast('节点离线，不可启用调度');return}g.enabled=!g.enabled;log(g.enabled?'启用网关调度':'网关进入维护',node(g.nodeId)?.name||id);render()}
function gatewayDetail(id){let g=S.gatewayNodes.find(x=>x.id===id),n=node(g?.nodeId);if(!g)return;modalOpen('网关详情',`<div class="keyval"><span>服务器</span><b>${E(n?.name||g.nodeId)}</b></div><div class="keyval"><span>地区</span><b>${regionFlag(n?.region)} ${E(n?.region||'未知')}</b></div><div class="keyval"><span>网关状态</span><b>${E(g.status)}</b></div><div class="keyval"><span>Nginx</span><b>${E(g.version)}</b></div><div class="keyval"><span>配置检查</span><b>${g.checksPassed?'通过':'未通过'}</b></div><div class="keyval"><span>调度资格</span><b>${gatewayEligible(g)?'允许':'禁止'}</b></div><div class="keyval"><span>检测说明</span><b>${E(g.checkNote||g.error||'未检查')}</b></div><p class="tiny muted">演示结果，不代表真实服务器上的 Nginx 状态。</p>`,btn('关闭','closeModal()'))}
function pluginEvent(p,action,status='成功'){S.pluginEvents.unshift({name:p.name,action,status,time:'刚刚'});S.pluginEvents=S.pluginEvents.slice(0,30);log('插件 · '+action,p.name,status)}
function pluginRepoModal(){let r=S.pluginRepo;modalOpen('插件中心 · 仓库配置',`<div class="help">默认使用项目官方 GitHub 仓库的 <b>Plugin/</b> 目录。正式官方地址尚未提供，发布时绑定；开发者可 Fork 项目后切换为自己的仓库。切换只影响后续插件目录和安装来源，不会自动改写已安装插件。</div><div class="field"><label>仓库来源</label><select id="repoMode" onchange="document.getElementById('repoUrlRow').style.display=this.value==='custom'?'block':'none'"><option value="official" ${r.mode==='official'?'selected':''}>项目官方仓库（默认）</option><option value="custom" ${r.mode==='custom'?'selected':''}>开发者 Fork 仓库</option></select></div><div class="field" id="repoUrlRow" style="display:${r.mode==='custom'?'block':'none'}"><label>GitHub 仓库 URL</label><input id="repoUrl" value="${E(r.url)}" placeholder="https://github.com/owner/server-fleet"></div><div class="field"><label>分支 / Tag（演示）</label><input id="repoRef" value="${E(r.ref||'main')}" placeholder="main"></div><div class="field"><label>插件目录（固定）</label><input value="Plugin/" disabled></div><div class="tiny muted">正式系统必须校验仓库来源、插件包哈希、版本签名及权限；单纯换仓库不能默许插件自动执行。</div>`,ok('保存仓库配置','pluginRepoSave()'))}
function pluginRepoSave(){let mode=V('repoMode'),url=V('repoUrl').trim().replace(/\/$/,'').replace(/\.git$/,''),ref=V('repoRef').trim();if(!/^[\w./-]{1,100}$/.test(ref)||ref.includes('..')){toast('分支或 Tag 无效');return}if(mode==='custom'&&!/^https:\/\/github\.com\/[\w.-]+\/[\w.-]+$/i.test(url)){toast('请输入 GitHub 仓库 URL，例如 https://github.com/owner/repo');return}S.pluginRepo={mode,url:mode==='custom'?url:'',ref,folder:'Plugin'};pluginEvent({name:'仓库配置'},mode==='custom'?'切换到 Fork 仓库':'切换官方仓库');closeModal();render();toast('已保存模拟仓库配置（未联网）')}
function pluginRefreshCatalog(){pluginEvent({name:'目录清单'},'本地模拟刷新');render();toast('模拟刷新：只有 Xray 节点管理器，未实际访问 GitHub')}
function pluginInstallAsk(id){let p=S.plugins.find(x=>x.id===id);if(!p||p.installed)return;modalOpen('按需安装 · '+E(p.name),`<div class="help">将仅在用户主动安装时从当前仓库 Plugin/ 获取指定插件版本。此 HTML 不进行网络下载，也不执行插件代码。</div><div class="keyval"><span>插件</span><b>${E(p.name)}</b></div><div class="keyval"><span>来源</span><b>${E(S.pluginRepo.mode==='official'?'官方仓库（演示）':S.pluginRepo.url)}</b></div><div class="keyval"><span>版本</span><b>${E(p.availableVersion)}</b></div><div class="keyval"><span>申请权限</span><b>${E(p.permissions.join(' · '))}</b></div><label class="checkbox-label"><input type="checkbox" id="pluginEnableNow" checked> 安装完成后立即热启用</label><div class="banner">${S.pluginRepo.mode==='custom'?'⚠ 来自第三方 Fork 仓库。请自行确认维护者和代码来源。':'官方仓库仍需在实际发布时绑定真实 URL 并校验签名。'}</div>`,ok('同意权限并模拟安装',`pluginInstall('${id}')`))}
function pluginInstall(id){let p=S.plugins.find(x=>x.id===id);if(!p||p.installed)return;p.installed=true;p.enabled=CK('pluginEnableNow');p.version='0.1.0-demo';p.installedFrom=S.pluginRepo.mode==='official'?'official':S.pluginRepo.url;pluginEvent(p,p.enabled?'热安装并启用':'热安装');closeModal();render();toast('已模拟按需安装插件'+(p.enabled?'，入口已热加载':''))}
function pluginSetEnabled(id,enabled){let p=S.plugins.find(x=>x.id===id);if(!p||!p.installed)return;p.enabled=enabled;pluginEvent(p,enabled?'热启用':'热禁用');render();toast('不重启主控，插件已'+(enabled?'启用':'禁用'))}
function pluginUpdateAsk(id){let p=S.plugins.find(x=>x.id===id);if(!p||!p.installed)return;modalOpen('热更新 · '+E(p.name),`<div class="help">正式流程：锁定目标版本 → 验证 → 停接新任务 → 等待可安全结束的任务 → 切换新版本 → 健康检查 → 失败时恢复旧版。</div><div class="keyval"><span>当前</span><b>${E(p.version)}</b></div><div class="keyval"><span>目标</span><b>${E(p.availableVersion)}</b></div><div class="banner">长时间运行的插件任务不能保证无损迁移，必要时应延期更新。</div>`,btn('取消','closeModal()')+btn('模拟失败并回滚',`pluginUpdateFail('${id}')`,'danger')+btn('模拟更新成功',`pluginUpdateSuccess('${id}')`,'primary'))}
function pluginUpdateSuccess(id){let p=S.plugins.find(x=>x.id===id);if(!p||!p.installed)return;p.version=p.availableVersion;p.lastUpdate='成功';pluginEvent(p,'热更新完成');closeModal();render();toast('插件版本已切换，主控无需重启')}
function pluginUpdateFail(id){let p=S.plugins.find(x=>x.id===id);if(!p||!p.installed)return;p.lastUpdate='更新失败，已保留旧版本';pluginEvent(p,'更新失败，保留原版本','失败');closeModal();render();toast('模拟更新失败：已保留 '+p.version+' 版本')}
function pluginUninstallAsk(id){let p=S.plugins.find(x=>x.id===id);if(!p||!p.installed)return;modalOpen('卸载插件 · '+E(p.name),`<p>这会移除该插件的运行入口，不影响 Server Fleet 核心功能和其他插件。</p><label class="checkbox-label"><input type="checkbox" id="pluginDeleteData"> 同时清除插件的演示配置数据</label><div class="notice">正式产品需要先停止插件任务，确认清理策略后卸载。此处只改变本地演示状态。</div>`,ok('确认模拟卸载',`pluginUninstall('${id}')`))}
function pluginUninstall(id){let p=S.plugins.find(x=>x.id===id);if(!p)return;let del=CK('pluginDeleteData');p.installed=false;p.enabled=false;p.version=null;if(del)delete p.localConfig;pluginEvent(p,'热卸载'+(del?'并清理配置':''));closeModal();if(S.page==='plugin-'+id)S.page='plugins';render();toast('已模拟卸载插件')}
function pluginInfoV04(id){let p=S.plugins.find(x=>x.id===id);if(!p)return;modalOpen('插件详情 · '+E(p.name),`<div class="keyval"><span>名称</span><b>${E(p.name)}</b></div><div class="keyval"><span>版本</span><b>${E(p.version||'未安装')} / 可用 ${E(p.availableVersion)}</b></div><div class="keyval"><span>来源</span><b>${E(p.installedFrom||'当前所选仓库')}</b></div><div class="keyval"><span>权限</span><b>${E(p.permissions.join('，'))}</b></div><div class="keyval"><span>兼容性</span><b>Server Fleet v0.x（演示说明）</b></div><div class="keyval"><span>运行环境</span><b>声明式组件 / 受控 WASM（规划）</b></div><div class="keyval"><span>最近更新</span><b>${E(p.lastUpdate||'无')}</b></div>`,btn('关闭','closeModal()'))}
function openPluginPage(id){let p=S.plugins.find(x=>x.id===id);if(!p?.installed||!p?.enabled){toast('插件未启用');return}if(id==='xray-manager'){S.page='plugin-xray-manager';save();render();return}modalOpen(p.name+' · 插件页面（模拟）',`<div class="help">插件通过标准组件在主控中新增页面或操作，不需要重新编译核心程序。</div><p>此处仅展示插件动态出现在导航中的效果。</p><div class="keyval"><span>当前版本</span><b>${E(p.version)}</b></div><div class="keyval"><span>权限范围</span><b>${E(p.permissions.join('、'))}</b></div>`,btn('关闭','closeModal()'))}
function notificationSettings(){let n=S.notifications;const checks=(k,label)=>`<label class="checkbox-label">${label} <input class="switch" type="checkbox" ${n[k].enabled?'checked':''} onchange="app.notifyToggle('${k}',this.checked)"></label>`;
return `<div class="help"><b>第一版：</b>QQ 官方机器人与 SMTP 邮箱。Telegram 已移除。QQ 主动投递受平台场景、发送对象及频控限制，不能保证必达；建议 SMTP 作为备用渠道。<br><b>演示安全提示：</b>不连接 QQ 或 SMTP；不收集、保存真实 AppSecret / SMTP 密码，请勿输入真实密钥。</div><div class="grid g2"><div class="gateway-step"><div class="inline-row"><b>✉ SMTP 邮箱</b>${tag(n.smtp.enabled?'已启用':'未启用',n.smtp.enabled?'green':'')}${checks('smtp','启用')}</div>${formField('SMTP 主机','smtpHost','text',n.smtp.host,'smtp.example.com')}${formField('端口','smtpPort','text',n.smtp.port)}<div class="field"><label>连接安全</label><select id="smtpSecurity">${['SSL/TLS','STARTTLS','无加密（不推荐）'].map(x=>`<option ${n.smtp.security===x?'selected':''}>${x}</option>`).join('')}</select></div>${formField('发件邮箱','smtpSender','text',n.smtp.sender,'alerts@example.com')}${formField('收件邮箱','smtpRecipient','text',n.smtp.recipient,'admin@example.com')}<div class="field"><label>SMTP 授权码 / 密码</label><input disabled type="password" placeholder="原型不接收真实密码；正式版通过后端安全配置"></div><div class="tools">${btn('保存 SMTP 设置','notifySaveSMTP()','sm primary')}${btn('模拟发送测试邮件',"notifyTest('smtp')",'sm')}</div></div><div class="gateway-step"><div class="inline-row"><b>🐧 QQ 官方机器人</b>${tag(n.qq.enabled?'已启用':'未启用',n.qq.enabled?'green':'')}${checks('qq','启用')}</div>${formField('机器人 AppID','qqAppId','text',n.qq.appId,'仅填写示例 ID')}<div class="field"><label>通知对象类型（以官方支持范围为准）</label><select id="qqTargetType">${['私聊','群聊'].map(x=>`<option ${n.qq.targetType===x?'selected':''}>${x}</option>`).join('')}</select></div>${formField('接收对象 ID','qqTargetId','text',n.qq.targetId,'示例：目标 ID')}<div class="field"><label>AppSecret</label><input disabled type="password" placeholder="原型不接收真实 AppSecret"></div><p class="tiny muted">本产品通过 QQ 官方机器人接口发送通知，不需要安装 OpenClaw。真实发送时必须遵守官方能力边界与频控。</p><div class="tools">${btn('保存 QQ Bot 设置','notifySaveQQ()','sm primary')}${btn('模拟发送 QQ 测试消息',"notifyTest('qq')",'sm')}</div></div></div><div class="event"><div><b>QQ 失败时尝试 SMTP 备用通知</b><div class="tiny muted">正式版需确保 SMTP 已配置并已启用；避免循环重试与重复告警。</div></div><div class="when"><input class="switch" type="checkbox" ${n.fallback?'checked':''} onchange="app.notifyFallback(this.checked)"></div></div><h4>通知测试与发送记录（模拟）</h4>${table(['时间','渠道','结果','说明'],n.logs.slice(0,8).map(x=>`<tr><td>${E(x.time)}</td><td>${E(x.channel)}</td><td>${tag(x.status,x.status==='成功（模拟）'?'green':'orange')}</td><td>${E(x.detail)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">尚未发送测试通知</td></tr>')}`}
function notifyToggle(type,on){S.notifications[type].enabled=on;log(on?'启用通知渠道':'停用通知渠道',type==='smtp'?'SMTP':'QQ Bot');render()}
function notifySaveSMTP(){let n=S.notifications.smtp;n.host=V('smtpHost').trim();n.port=V('smtpPort').trim();n.security=V('smtpSecurity');n.sender=V('smtpSender').trim();n.recipient=V('smtpRecipient').trim();if(n.port&&!/^\d{1,5}$/.test(n.port)){toast('SMTP 端口不正确');return}log('保存 SMTP 通知配置','SMTP（不含密码）');render();toast('已保存模拟 SMTP 配置，不含凭证')}
function notifySaveQQ(){let n=S.notifications.qq;n.appId=V('qqAppId').trim();n.targetType=V('qqTargetType');n.targetId=V('qqTargetId').trim();log('保存 QQ Bot 通知配置','QQ Bot（不含 AppSecret）');render();toast('已保存模拟 QQ Bot 配置，不含凭证')}
function notifyTest(type){let n=S.notifications[type];let name=type==='qq'?'QQ Bot':'SMTP';let reason=!n.enabled?'请先启用渠道':type==='qq'?(!n.appId||!n.targetId?'请先填写示例 AppID 和接收对象':'已模拟发送。真实 QQ 主动消息仍需通过平台验证'):(!n.host||!n.sender||!n.recipient?'请补全 SMTP 主机及发件人、收件人':'已模拟发送。未连接真实 SMTP');let ok=n.enabled&&(type==='qq'?!!n.appId&&!!n.targetId:!!n.host&&!!n.sender&&!!n.recipient);S.notifications.logs.unshift({time:'刚刚',channel:name,status:ok?'成功（模拟）':'配置不足',detail:reason});log('测试通知（模拟）',name,ok?'成功':'失败');render();toast(reason)}
function notifyFallback(value){S.notifications.fallback=value;log('修改通知备用策略',value?'开启':'关闭');render()}

S.serviceGroups=[{id:'sg-web',name:'Web 业务集群',description:'示例：两台 Web 节点',members:['n1','n5'],port:8080,policy:'round-robin',loadBalance:true,gatewayIds:['gw-demo1'],paused:[],health:'健康',healthCheck:'HTTP /health'}, {id:'sg-backup',name:'备份服务组',description:'示例：仅用于任务和证书分配，不参与负载均衡',members:['n4','n6'],port:443,policy:'none',loadBalance:false,gatewayIds:[],paused:[],health:'健康',healthCheck:'无'}];

S.controllerUpdate={current:'v0.4.0',available:'v0.5.0',checked:false,checkResult:'',phase:'未检查',history:[],backupOk:false};
// This is only a UI model. Real authorization always belongs to the back end.
S.aiScope={grants:[],sessionId:'demo-session-1',revision:1};S.aiResourceRecommendation=null;S.pendingAI=null;

function serviceById(id){return S.serviceGroups.find(g=>g.id===id)}
function serviceGroupReadyCount(g){return g.members.filter(id=>node(id)?.online&&!g.paused.includes(id)).length}
function servicegroups(){ensureV05();let g=serviceById(S.sgSelected)||S.serviceGroups[0];const list=S.serviceGroups.map(x=>`<button class="list-choice ${x.id===g?.id?'active':''}" onclick="app.sgSelect('${x.id}')">◈ ${E(x.name)} <span class="muted">(${x.members.length})</span></button>`).join('');const detail=g?`<div class="inline-row" style="justify-content:space-between"><div><h3 style="margin:0">${E(g.name)}</h3><div class="muted tiny">${E(g.description)} · 已加入 ${g.members.length} 台</div></div><div class="tools">${btn('编辑服务组','sgEditModal()','sm')}${btn('成员管理','sgMembersModal()','sm primary')}${btn('删除','sgDeleteAsk()','sm danger')}</div></div><div class="grid g4" style="margin:18px 0">${stat('节点总数',g.members.length)}${stat('运行中',serviceGroupReadyCount(g))}${stat('调度模式',g.loadBalance?'已启用':'未启用')}${stat('服务端口',g.port)}</div>${panel('服务设置',`<div class="keyval"><span>服务类型</span><b>${g.loadBalance?'负载均衡服务':'通用资源集合'}</b></div><div class="keyval"><span>调度策略</span><b>${g.loadBalance?E(g.policy):'无'}</b></div><div class="keyval"><span>健康检查</span><b>${E(g.healthCheck)}</b></div><div class="keyval"><span>关联的网关</span><b>${g.gatewayIds.map(id=>E(node(S.gatewayNodes.find(w=>w.id===id)?.nodeId)?.name||id)).join(' · ')||'未关联'}</b></div><div class="help">服务组可以用于网关调度、证书下发、批量任务和 AI 授权。仅当明确启用负载均衡、网关就绪且成员健康时参与流量调度。</div>`)}${panel('成员与参与状态',table(['节点','地区','在线状态','调度状态','操作'],g.members.map(id=>node(id)).filter(Boolean).map(n=>`<tr><td><b>${E(n.name)}</b></td><td>${regionFlag(n.region)} ${E(n.region)}</td><td>${tag(n.online?'在线':'离线',n.online?'green':'red')}</td><td>${tag(g.paused.includes(n.id)?'已暂停':n.online?'可用':'不可用',g.paused.includes(n.id)?'orange':n.online?'green':'red')}</td><td>${btn(g.paused.includes(n.id)?'恢复参与':'暂停参与',`sgPause('${n.id}')`,'sm')}</td></tr>`).join('')))}</div>`:'<div class="empty">尚无服务组</div>';return pageTitle('服务组管理','服务组是正式资源类型：统一组织节点，可供网关调度、证书下发、批量任务与 AI 授权。与标签式节点分组不同。',btn('+ 新建服务组','sgCreateModal()','primary'))+`<div class="split"><section class="panel"><div class="panel-h">服务组列表</div>${list||'<div class="empty">暂无服务组</div>'}</section><section class="panel"><div class="panel-body">${detail}</div></section></div>`}

function sgEditModal(){sgFormModal(serviceById(S.sgSelected))}
function sgFormModal(g){let selected=g?.members||[];modalOpen(g?'编辑服务组':'新建服务组',`<div class="formcols">${formField('服务组名称','sgName','text',g?.name||'','例如：业务 API 集群')}${formField('服务端口','sgPort','number',String(g?.port||8080))}</div>${formField('用途描述','sgDesc','text',g?.description||'')}<label class="checkbox-label"><input type="checkbox" id="sgLB" ${g?.loadBalance?'checked':''}> 启用网关负载均衡（不是所有服务组都需要）</label><div class="field"><label>调度策略</label><select id="sgPolicy">${[['round-robin','轮询'],['least-conn','最少连接'],['none','不调度']].map(([v,l])=>`<option value="${v}" ${g?.policy===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>关联网关（仅展示已就绪）</label><select id="sgGateway"><option value="">暂不关联</option>${S.gatewayNodes.filter(gatewayEligible).map(w=>`<option value="${E(w.id)}" ${g?.gatewayIds?.includes(w.id)?'selected':''}>${E(node(w.nodeId)?.name||w.id)}</option>`).join('')}</select></div><div class="field"><label>健康检查</label><select id="sgHealthCheck">${['HTTP /health','TCP 端口','无'].map(x=>`<option ${g?.healthCheck===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>选择成员节点</label><div class="grid g2">${S.nodes.map(n=>`<label class="checkbox-label"><input type="checkbox" name="sgMembers" value="${E(n.id)}" ${selected.includes(n.id)?'checked':''}> ${E(n.name)} ${n.online?'🟢':'⚪'}</label>`).join('')}</div></div><div class="caption-safety">保存仅修改演示数据。新加入服务组的节点不会自动扩大任何既有 AI 对话的授权范围。</div>`,ok('保存服务组',`sgSave('${g?.id||''}')`))}
function sgSave(id){let name=V('sgName').trim(),port=+V('sgPort'),members=[...document.querySelectorAll('input[name="sgMembers"]:checked')].map(x=>x.value);if(!name||!Number.isInteger(port)||port<1||port>65535){toast('名称不能为空，端口应在 1–65535');return}let lb=CK('sgLB'),pol=V('sgPolicy'),gw=V('sgGateway');if(lb&&pol==='none'){toast('启用负载均衡需选择有效调度策略');return}if(lb&&gw&&!gatewayEligible(S.gatewayNodes.find(g=>g.id===gw))){toast('网关未就绪');return}let g=id?serviceById(id):null;if(!g){g={id:'sg'+Date.now(),name,description:'',members:[],paused:[],gatewayIds:[]};S.serviceGroups.push(g)}Object.assign(g,{name,description:V('sgDesc').trim(),port,policy:lb?pol:'none',loadBalance:lb,gatewayIds:gw?[gw]:[],healthCheck:V('sgHealthCheck'),members,paused:g.paused.filter(x=>members.includes(x)),health:'健康'});S.sgSelected=g.id;log(id?'编辑服务组':'新建服务组',name);closeModal();render();toast('已保存服务组（模拟）')}
function sgMembersModal(){sgFormModal(serviceById(S.sgSelected))}
function sgDeleteAsk(){let g=serviceById(S.sgSelected);if(!g)return;modalOpen('删除服务组',`<p>将删除 <b>${E(g.name)}</b> 的服务组定义，不删除成员节点。</p><div class="caption-safety">与证书、网关及 AI 的关系将发生变化。已有 AI 会话使用固定成员快照，不因此获得新权限；真实后端需校验引用并吊销相应授权。</div>`,ok('删除',`sgDelete('${g.id}')`))}
function sgDelete(id){let g=serviceById(id);if(!g)return;S.serviceGroups=S.serviceGroups.filter(x=>x.id!==id);S.sgSelected=S.serviceGroups[0]?.id||'';aiInvalidateScope('服务组已删除');log('删除服务组',g.name);closeModal();render()}
function sgPause(id){let g=serviceById(S.sgSelected);if(!g)return;g.paused=g.paused.includes(id)?g.paused.filter(x=>x!==id):[...g.paused,id];log('切换服务组成员调度',g.name+' / '+(node(id)?.name||id));render()}
function certsV05(){let tabs=['公网 HTTPS 证书','内部 TLS 与下发'];let publicView=`<div class="grid g3">${S.certs.map(c=>`<section class="panel"><div class="panel-body"><div class="inline-row"><b>${E(c.domain)}</b>${tag(c.status,c.status==='有效'?'green':'orange')}</div><div class="keyval"><span>有效期至</span><b>${E(c.expires)}</b></div><div class="keyval"><span>自动续期</span><label><input class="switch" type="checkbox" ${c.renew?'checked':''} onchange="app.certRenew('${c.id}',this.checked)"></label></div><div class="tools">${btn('模拟续期',`renewCert('${c.id}')`,'sm')}${btn('查看详情',`certInfo('${c.id}')`,'sm')}</div></div></section>`).join('')}</div>`;let internal=`${panel('内部 TLS 凭证分发',`<div class="help">选择服务组批量下发。<b>信任 CA 证书</b>可在成员节点间共享；<b>服务/节点身份凭证</b>必须为每个目标独立签发，私钥留在各自节点。不会将一份私钥复制给所有节点。</div><div class="tools">${btn('＋ 下发证书','certDeployModal()','primary')}${btn('证书轮换说明','certPolicyInfo()')}</div>`)}${panel('下发任务与证书状态',table(['任务','目标服务组','凭证类型','结果','节点结果','操作'],S.certDeployments.map(d=>`<tr><td>${E(d.id)}</td><td>${E(d.groupName)}</td><td>${E(d.type==='trust'?'CA 信任包':'独立身份凭证')}</td><td>${tag(d.status,d.status==='已完成'?'green':'orange')}</td><td>${E(d.results.map(x=>x.name+':'+x.status).join('；'))}</td><td>${btn('详情',`certDeployDetail('${d.id}')`,'sm')}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">暂无下发任务</td></tr>'))}${panel('安全原则',`<div class="help">内部服务 TLS 与公网 HTTPS 分开管理；证书下发不等于 TLS 已配置成功。需验证 SAN / 工作负载身份、相互信任、服务侧 TLS 配置和证书轮换。私有 CA 的离线根证书私钥永不下发。</div>`)}`;return pageTitle('证书管理','管理公网 HTTPS 与内部节点/服务 TLS 凭证；支持按服务组下发并查看每台节点的状态。',S.certTab==='内部 TLS 与下发'?btn('＋ 下发证书','certDeployModal()','primary'):btn('+ 申请证书','modalCert()','primary'))+`<div class="pilltabs" style="margin-bottom:17px">${tabs.map(t=>`<button class="${t===S.certTab?'active':''}" onclick="app.certTab('${t}')">${t}</button>`).join('')}</div>${S.certTab===tabs[0]?publicView:internal}`}
function certTab(t){S.certTab=t;save();render()}
function certDeployModal(){let groups=S.serviceGroups;modalOpen('下发内部 TLS 证书',`<div class="help">此操作以服务组为目标。真实系统应通过受控任务逐节点验证状态，不复制 CA 根私钥或共享节点身份私钥。</div><div class="field"><label>目标服务组</label><select id="certSG">${groups.map(g=>`<option value="${E(g.id)}">${E(g.name)}（${g.members.length} 个成员）</option>`).join('')}</select></div><div class="field"><label>证书类型</label><select id="certKind"><option value="trust">CA 信任证书 / 信任包</option><option value="identity">为每个节点签发独立身份凭证（本地生成私钥）</option></select></div><label class="checkbox-label"><input type="checkbox" id="certConsent"> 我确认下发范围及该操作会影响 TLS 信任/服务配置</label><div class="caption-safety">节点离线时记为待重试；历史身份凭证不得用于复用新节点。模拟证书不包含真实私钥。</div>`,ok('创建模拟下发任务','certDeployCreate()'))}
function certDeployCreate(){if(!CK('certConsent')){toast('请先确认下发范围');return}let g=serviceById(V('certSG'));if(!g||!g.members.length){toast('请选择包含节点的服务组');return}let kind=V('certKind'),results=g.members.map(id=>({nodeId:id,name:node(id)?.name||id,status:node(id)?.online?'成功（模拟）':'待重试（离线）',identityId:kind==='identity'?'spiffe://demo.local/node/'+id:null}));let d={id:'CERT-'+String(S.certDeploySeq++).padStart(3,'0'),groupId:g.id,groupName:g.name,type:kind,status:results.every(x=>x.status.startsWith('成功'))?'已完成':'部分完成',results,createdAt:'刚刚',revoked:false};S.certDeployments.unshift(d);log('模拟下发内部 TLS 凭证',g.name+' / '+(kind==='trust'?'信任包':'独立身份'));closeModal();render();toast('已生成逐节点模拟下发结果')}
function certDeployDetail(id){let d=S.certDeployments.find(x=>x.id===id);if(!d)return;modalOpen('证书下发详情 '+E(id),`<div class="keyval"><span>目标</span><b>${E(d.groupName)}</b></div><div class="keyval"><span>凭证</span><b>${d.type==='trust'?'CA 信任包':'独立节点身份凭证'}</b></div><div class="keyval"><span>状态</span><b>${E(d.status)}</b></div>${table(['节点','结果','身份（演示）'],d.results.map(x=>`<tr><td>${E(x.name)}</td><td>${E(x.status)}</td><td>${E(x.identityId||'信任链配置')}</td></tr>`).join(''))}<div class="caption-safety">撤销操作必须在后端执行，并处理旧凭证在远端的残留、信任撤销及审计。</div>`,btn('关闭','closeModal()')+btn('标记撤销（模拟）',`certRevoke('${id}')`,'danger'))}
function certRevoke(id){let d=S.certDeployments.find(x=>x.id===id);if(!d)return;d.status='已撤销（模拟）';d.revoked=true;log('模拟撤销内部 TLS 凭证',id);closeModal();render()}
function certPolicyInfo(){modalOpen('内部 TLS 证书安全规则',`<p>信任包与独立身份凭证分开下发；节点私钥尽量在节点本地生成，不在主控集中共享。按服务组批量执行，但每个成员都需独立状态与失败重试。</p><p>应支持过期轮换、撤销、状态验证和证书审计；服务本身需要启用 TLS，不能把“下发成功”等同于“已建立加密连接”。</p>`,btn('关闭','closeModal()'))}
function controllerUpdateCheck(){ensureV05();S.controllerUpdate.checked=true;S.controllerUpdate.phase='检测到新版本';S.controllerUpdate.checkResult='版本元信息和发布签名需在正式后端验证；本页仅生成演示结果';log('检查主控更新（模拟）','v0.5.0');render();toast('模拟检查：发现演示更新包')}
function controllerUpdateAsk(){let u=S.controllerUpdate;if(!u.checked){toast('请先检查更新');return}modalOpen('一键更新 · 主控系统',`<div class="state-flow"><span class="state-step">来源与签名验证</span> → <span class="state-step">兼容性检查</span> → <span class="state-step">备份配置</span> → <span class="state-step">安装更新</span> → <span class="state-step">健康检查</span></div><p>当前（演示）：${E(u.current)}　→　目标：${E(u.available)}</p><label class="checkbox-label"><input type="checkbox" id="updateConsent"> 我同意模拟升级，并理解正式更新将短暂影响管理端服务</label><div class="caption-safety">如果新版本未通过验证，应恢复旧程序和兼容的数据快照。数据迁移是否可逆必须在真实升级计划中确认。</div>`,btn('取消','closeModal()')+btn('模拟成功','controllerUpdateFinish(false)','primary')+btn('模拟失败并回滚','controllerUpdateFinish(true)','danger'))}
function controllerUpdateFinish(fail){if(!CK('updateConsent')){toast('请确认更新影响');return}let u=S.controllerUpdate;u.backupOk=true;u.phase=fail?'升级失败，已恢复旧版本':'健康检查通过，升级完成';u.history.unshift({time:'刚刚',from:u.current,to:u.available,result:u.phase,backup:'已生成演示快照'});if(!fail){u.current=u.available;u.checked=false}log('一键更新主控（模拟）',u.phase,fail?'失败':'成功');closeModal();render();toast(u.phase)}
function updateSettingsV05(){let u=S.controllerUpdate;return `${panel('主控系统更新',`<div class="grid g3">${stat('当前主控版本',E(u.current),'仅为演示版本')}${stat('演示目标版本',E(u.available),'非真实版本检查')}${stat('更新状态',E(u.phase),'人工确认升级')}</div><div class="tools" style="margin-top:15px">${btn('检查更新','controllerUpdateCheck()','primary')}${btn('一键更新','controllerUpdateAsk()')}${btn('打开更新中心',"go('updates')")}</div><div class="section-note">版本信息、检查签名、备份、安装和回滚均为模拟动作；任何按钮不会修改本地操作系统。</div>`)}${panel('最近更新记录',table(['时间','原版本','目标','结果','备份'],u.history.map(x=>`<tr><td>${E(x.time)}</td><td>${E(x.from)}</td><td>${E(x.to)}</td><td>${E(x.result)}</td><td>${E(x.backup)}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">暂无更新操作</td></tr>'))}`}
// AI resource scope: simulated UI behavior only; authorization enforcement must be on real back-end APIs/tools.
function aiGrantResource(kind,id){ensureV05();let label='',memberIds=[];if(kind==='node'){let n=node(id);if(!n)return;label=n.name;memberIds=[id]}else{let g=serviceById(id);if(!g)return;label=g.name;memberIds=[...g.members]}let key=kind+':'+id;if(S.aiScope.grants.some(x=>x.key===key)){toast('此资源已经授权');return}S.aiScope.grants.push({key,kind,id,label,memberIds,revision:S.aiScope.revision+1});S.aiScope.revision++;aiInvalidatePending('授权范围变化');log('AI 会话授权资源',label);render()}
function aiAllowedNodes(){let ids=new Set();S.aiScope.grants.forEach(g=>{if(g.kind==='node'){if(node(g.id))ids.add(g.id)}else if(serviceById(g.id)){g.memberIds.forEach(id=>{if(node(id)&&serviceById(g.id).members.includes(id))ids.add(id)})}});return [...ids]}
function aiInvalidatePending(reason){if(S.pendingAI){S.pendingAI=null;S.chat.push({who:'bot',text:'资源授权范围发生变化，原执行方案已失效。请重新生成计划。'+(reason||'')})}}
function aiInvalidateScope(reason){S.aiScope.grants=S.aiScope.grants.filter(g=>g.kind==='node'||serviceById(g.id));S.aiScope.revision++;aiInvalidatePending(reason)}
function aiRevoke(key){let before=S.aiScope.grants.length;S.aiScope.grants=S.aiScope.grants.filter(x=>x.key!==key);if(before!==S.aiScope.grants.length){S.aiScope.revision++;aiInvalidatePending('授权已撤回');log('撤回 AI 会话授权',key)}render()}
function aiResourceDrop(e){e.preventDefault();let root=document.getElementById('aiDrop');root?.classList.remove('dragover');let val=e.dataTransfer?.getData('text/plain')||'';let [kind,id]=val.split(':');if((kind==='node'||kind==='group')&&id)aiGrantResource(kind,id)}
function aiAddPrompt(){let opts=`<div class="field"><label>资源类型</label><select id="aiResourceKind" onchange="app.aiResourceTypeChange(this.value)"><option value="node">节点</option><option value="group">服务组</option></select></div><div class="field"><label>选择资源</label><select id="aiResourceId">${S.nodes.map(n=>`<option value="${E(n.id)}">${E(n.name)}</option>`).join('')}</select></div><div class="help">资源必须由你主动添加。服务组授权会冻结当时的成员集合；新加入的成员不会自动获得旧会话权限。</div>`;modalOpen('授权 AI 使用资源',opts,ok('授权到当前对话','aiAddFromModal()'))}
function aiResourceTypeChange(kind){let el=document.getElementById('aiResourceId');if(!el)return;el.innerHTML=(kind==='node'?S.nodes.map(n=>`<option value="${E(n.id)}">${E(n.name)}</option>`):S.serviceGroups.map(g=>`<option value="${E(g.id)}">${E(g.name)}</option>`)).join('')}
function aiAddFromModal(){let kind=V('aiResourceKind'),id=V('aiResourceId');closeModal();aiGrantResource(kind,id)}
function aiRecommend(){S.aiResourceRecommendation={kind:'network',reason:'当前已授权资源的异常可能与上游网络或网关有关。建议你自行选择相关网关节点，只授予只读日志与监控权限。'};save();render()}
function aiRecommendationRequest(){modalOpen('AI 申请额外资源 · 需人工授权',`<div class="help">AI 目前仅能推荐资源类型，无法自行读取未授权节点清单、状态或秘密。请由管理员从自己有权限的资源列表中明确选择。</div><div class="field"><label>你决定授权哪个节点</label><select id="aiReqNode">${S.nodes.map(n=>`<option value="${E(n.id)}">${regionFlag(n.region)} ${E(n.name)}</option>`).join('')}</select></div><div class="caption-safety">授权只对当前对话生效，不自动授予跨节点 SSH / 网络访问能力。生产环境还须控制凭据与任意 Shell 横向移动。</div>`,ok('手动授权所选资源','aiRequestApprove()'))}
function aiRequestApprove(){let id=V('aiReqNode');closeModal();S.aiResourceRecommendation=null;aiGrantResource('node',id)}

function aiV05(){ensureV05();let scope=S.aiScope,grants=scope.grants,allowed=aiAllowedNodes(),pending=S.pendingAI,grantTiles=(kind,arr)=>arr.map(x=>{let key=kind+':'+x.id;return `<div class="resource-tile ${grants.some(g=>g.key===key)?'selected':''}" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${key}')" title="拖入下方授权框或点击添加" onclick="app.aiGrantResource('${kind}','${x.id}')"><span>${kind==='node'?'🖥️':'◈'}</span><div><b>${E(x.name)}</b><small>${kind==='node'?regionFlag(x.region)+' '+E(x.region):x.members.length+' 台节点（成员快照）'}</small></div></div>`}).join('');return pageTitle('AI 运维','AI 只能通过已授权的节点/服务组进行查询和操作；没有授权时默认拒绝。此页面是权限交互演示，非真实安全隔离。',btn('+ 授权资源','aiAddPrompt()','primary')+btn('新对话（清空授权）','aiNewSession()'))+`<section class="panel" style="margin-bottom:15px"><div class="panel-h">可分配资源 · 拖入下方对话授权区 / 点击添加</div><div class="panel-body"><b>节点</b><div class="resource-strip">${grantTiles('node',S.nodes)}</div><div style="margin-top:15px"><b>服务组</b></div><div class="resource-strip">${grantTiles('group',S.serviceGroups)}</div><div class="scope-help" style="margin-top:12px">本资源列表只向登录用户展示其有权查看的资源；AI 没有自动读取列表的能力。拖入服务组时冻结当前成员快照。</div></div></section><section class="panel" style="margin-bottom:15px"><div class="panel-h">当前对话资源授权 · ${grants.length} 个授权项 / ${allowed.length} 台唯一节点</div><div class="panel-body"><div id="aiDrop" class="scope-drop" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="app.aiResourceDrop(event)">${grants.map(g=>`<span class="scope-chip">${g.kind==='node'?'🖥️':'◈'} ${E(g.label)}${g.kind==='group'?' ('+g.memberIds.length+' 台快照)':''}<button aria-label="撤回 ${E(g.label)}" onclick="app.aiRevoke('${g.key}')">×</button></span>`).join('')||'<span class="muted tiny">🔒 默认零授权。将上方节点或服务组拖入此处，或点击「授权资源」。</span>'}</div><div class="scope-help" style="margin-top:10px">当前会话：${E(scope.sessionId)} · 授权版本 ${scope.revision}。所有模拟工具调用都会检查授权范围；真实服务必须在后端再次鉴权并限制凭据与横向网络访问。</div></div></se  if(!['per_action','auto'].includes(mode))return;S.aiApproval.mode=mode;S.aiApproval.expiresAt=0;aiInvalidatePending('审批模式变化');aiApprovalRecord('切换为'+(mode==='auto'?'自动审批':'每次审批'),'策略变更');save();render();toast('审批模式已更新')}

function aiReadResult(question,nodeIds){let targets=nodeIds.map(id=>node(id)).filter(Boolean);if(/离线|故障/.test(question)){let off=targets.filter(n=>!n.online);return `在当前授权的 ${targets.length} 台节点中发现 ${off.length} 台离线：\n`+(off.map(n=>'• '+n.name).join('\n')||'无')}

 else {S.tasks.unshift({id:'T-AI'+Date.now().toString().slice(-6),name:'AI '+(automated?'自动':'已审批')+'模拟任务',target:plan.target,content:plan.action,count:plan.nodeIds.length,done:0,status:'预演完成',time:'刚刚'});S.chat.push({who:'bot',text:(automated?'✅ 已按模式自动执行':'✅ 已审批执行')+` ${plan.nodeIds.length} 台已授权在线节点的模拟任务。未授权节点未触及。`})}

function askAIV05(text){ensureV06();let q=(text||V('aiInput')).trim();if(!q)return;S.chat.push({who:'me',text:q});let ids=aiAllowedNodes();if(/推荐|申请|额外资源|更多资源/.test(q)){S.chat.push({who:'bot',text:'我可以推荐其他资源类型，但无法查看未授权节点的实际状态。请由你确认后分配。'});S.aiResourceRecommendation={kind:'generic',reason:'可按本次已授权诊断结果，建议管理员提供相关网关或依赖节点；未批准前无访问权限。'};S.pendingAI=null;save();render();return}
 if(!ids.length){S.chat.push({who:'bot',text:'🔒 零授权拒绝：当前对话没有可访问节点。审批模式不会解除此限制。'});S.pendingAI=null;aiApprovalRecord('请求无授权节点：'+q,'拒绝');save();render();return}

 let mode=S.aiApproval.mode;let plan={summary:`${risk} · ${actionType==='read'?'查询节点信息':'执行节点操作'}（模拟）`,target,action:q,question:q,nodeIds:targetIds,actionType,risk,revision:S.aiScope.revision,modeAtCreate:mode};let automated=mode==='full'||mode==='auto'&&(actionType==='read'||lowWrite);
 if(automated){S.chat.push({who:'bot',text:`审批策略「${mode==='full'?'完全访问':'自动审批'}」允许这项${risk}操作；仅使用 ${targetIds.length} 台已授权节点，执行前再次检查资源范围。`});aiExecuteV06(plan,true)}
 else {S.pendingAI=plan;S.chat.push({who:'bot',text:`⏳ 需要你的批准：${risk}操作，涉及 ${targetIds.length} 台授权节点。当前模式「${mode==='auto'?'自动审批':'每次审批'}」要求本次手动确认。`});aiApprovalRecord(`请求审批：${q} · ${target}`,'等待审批');save();render()}}

 let modes=[['per_action','每次审批','每项 AI 工具调用均等待确认','🛡️'],['auto','自动审批','查询与低风险操作自动放行，其余逐项审批','⚡'],['full','完全访问','限时自动批准所有已获授权且用户有权执行的操作','🔓']];

// v0.8: Product-only interactions. No networking or credential material is stored.
function ensureV08(){
 if(!S.v08||typeof S.v08!=='object')S.v08={};let x=S.v08;
 if(!x.publish)x.publish={step:0,name:'示例网站发布',serviceId:'sg-web',gatewayId:'gw-demo1',domain:'app.example.com',https:true,monitor:true,history:[]};
 if(!x.monitors)x.monitors=[{id:'mon-demo',name:'示例站点',type:'HTTP/HTTPS',target:'https://app.example.com',interval:60,timeout:5,fail:3,recover:2,status:'正常',source:'主控',linked:'sg-web',paused:false}];
 if(!x.monitorTab)x.monitorTab='resources';
 if(!x.credentials)x.credentials=[{id:'c-cf',name:'Cloudflare 主账号',kind:'API Token',usage:'DNS 管理',state:'未验证',last:'从未',refs:1},{id:'c-smtp',name:'SMTP 通知账户',kind:'密码',usage:'SMTP 通知',state:'未验证',last:'从未',refs:1}];
 if(!x.recovery)x.recovery={lastCheck:'未检测',report:'',restorePhase:'未开始',oldControllerFenced:false};
 if(!x.traffic)x.traffic={};
 for(const n of S.nodes){if(!x.traffic[n.id])x.traffic[n.id]={quota:n.quota||1024,used:n.traffic||0,resetDay:1,expires:'2026-12-31',remind:7,source:'Agent 网卡估算',direction:'出站',cycle:'按自然月',complete:n.online};}
 if(!x.publications)x.publications=[];if(!Array.isArray(x.publish.gatewayIds))x.publish.gatewayIds=x.publish.gatewayId?[x.publish.gatewayId]:[];if(!x.publish.dnsAccountId)x.publish.dnsAccountId=S.dnsAccounts?.find(a=>a.enabled)?.id||'';if(!x.publish.zoneId)x.publish.zoneId=S.dnsZones?.find(z=>z.accountId===x.publish.dnsAccountId)?.id||'';if(!x.publish.certificateId)x.publish.certificateId=S.certs?.find(c=>c.status==='有效')?.id||'';
 if(!x.taskRunHistory)x.taskRunHistory=[];
}

 if(i===3)content=`<div class="sf08-box">${sf08Row('服务组',sg?.name||'未选择')}${sf08Row('服务端口',sg?.port||'—')}${sf08Row('网关',p.gatewayIds.map(id=>node(S.gatewayNodes.find(x=>x.id===id)?.nodeId)?.name||id).join('、')||'未选择')}${sf08Row('域名',p.domain)}${sf08Row('DNS 账号',S.dnsAccounts.find(a=>a.id===p.dnsAccountId)?.name||'未配置')}${sf08Row('证书',S.certs.find(c=>c.id===p.certificateId)?.domain||'未选择')}${sf08Row('HTTPS',p.https?'已选择':'不启用')}${sf08Row('服务监控',p.monitor?'自动生成':'不生成')}</div><div class="sf08-warning">发布应按“预检查 → 应用网关配置 → DNS/证书 → 外部验证”记录独立阶段；部分失败不能显示全部成功，DNS 变更不可保证瞬时回滚。</div>`;
 return pageTitle('服务发布','复用服务组、网关、DNS 和证书，通过一个向导发布已有 HTTP/HTTPS 服务。')+`<section class="panel"><div class="panel-body"><div class="sf08-progress">${steps.map((t,j)=>`<button class="sf08-step ${j===i?'active':''}" onclick="app.sf08PublishStep(${j})">${j+1}. ${t}</button>`).join('')}</div>${content}<div class="sf08-action">${btn('上一步','sf08PublishStep('+(i-1)+')','sm')}${i<3?btn('下一步','sf08PublishStep('+(i+1)+')','primary'):btn('预检查并模拟发布','sf08PublishConfirm()','primary')}</div></div></section>${panel('发布历史',table(['发布名称','目标','域名','状态','操作'],S.v08.publications.map(x=>`<tr><td>${E(x.name)}</td><td>${E(x.service)}</td><td>${E(x.domain)}</td><td>${tag(x.state,x.state==='模拟已完成'?'green':'orange')}</td><td>${btn('详情',`sf08PubDetail('${x.id}')`,'sm')}</td></tr>`).join('')))}<div class="help">当前模拟发布成功/失败记录，不会实际配置 DNS、证书或 Nginx。</div>`}

function sf08PubDetail(id){let p=S.v08.publications.find(x=>x.id===id);if(!p)return;modalOpen('服务发布作业详情',`<h3>${E(p.name)}</h3>${p.stages.map(x=>`<div class="sf08-row">${E(x)}</div>`).join('')}<div class="help">成功记录仅为演示结果。</div>`,btn('关闭','closeModal()'))}
function monitor(){ensureV08();let tab=S.v08.monitorTab;return sf08Tabs([['资源监控','resources'],['服务监控','services'],['告警事件','alerts']].map(x=>x[0]),({resources:'资源监控',services:'服务监控',alerts:'告警事件'})[tab], 'sf08MonitorTab') + (tab==='resources'?monitorBase():tab==='services'?sf08ServiceMonitor():sf08AlertEvents())}
function sf08MonitorTab(t){S.v08.monitorTab=({'资源监控':'resources','服务监控':'services','告警事件':'alerts'})[t]||'resources';save();render()}
function sf08ServiceMonitor(){let x=S.v08.monitors;return pageTitle('服务可用性监控','HTTP/HTTPS、TCP 与 TLS 检查；探测节点失联不等于业务故障。',btn('+ 新建监控','sf08NewMonitor()','primary'))+`<div class="grid g4">${stat('监控总数',x.length)}${stat('正常',x.filter(a=>a.status==='正常').length)}${stat('异常',x.filter(a=>a.status==='异常').length)}${stat('未知/待确认',x.filter(a=>['未知','待确认'].includes(a.status)).length)}</div>${panel('监控对象',table(['名称','检测类型','目标','来源','间隔','状态','操作'],x.map(m=>`<tr><td><b>${E(m.name)}</b></td><td>${E(m.type)}</td><td>${E(m.target)}</td><td>${E(m.source)}</td><td>${m.interval} 秒</td><td>${tag(m.paused?'已暂停':m.status,m.status==='正常'?'green':m.status==='异常'?'red':'orange')}</td><td>${btn('模拟探测',`sf08CheckMonitor('${m.id}')`,'sm')}${btn(m.paused?'恢复':'暂停',`sf08ToggleMonitor('${m.id}')`,'sm')}${btn('删除',`sf08DelMonitor('${m.id}')`,'sm danger')}</td></tr>`).join('')))}<div class="help">建议判定：连续失败 3 次为异常、连续成功 2 次为恢复。演示点击探测只更改模拟状态。真实告警必须去重并复用 QQ Bot / SMTP 通知。</div>`}
function sf08NewMonitor(){modalOpen('新增服务可用性监控',`${formField('名称','m08name','text','','示例：官网健康检查')}<div class="formcols"><div class="field"><label>类型</label><select id="m08type"><option>HTTP/HTTPS</option><option>TCP</option><option>TLS</option></select></div><div class="field"><label>检测来源</label><select id="m08source"><option>主控</option><option>指定在线 Agent（后续选择）</option></select></div></div>${formField('目标 URL / 域名 / IP:端口','m08target','text','','https://example.com')}<div class="formcols">${formField('间隔（秒）','m08interval','number','60')}${formField('超时（秒）','m08timeout','number','5')}</div><div class="help">初版默认连续失败 3 次认定故障、连续成功 2 次恢复。新增时不会向外部目标发起请求。</div>`,ok('保存模拟监控','sf08SaveMonitor()'))}
function sf08SaveMonitor(){let name=V('m08name').trim(),target=V('m08target').trim(),interval=+V('m08interval'),timeout=+V('m08timeout');if(!name||!target||interval<15||timeout<1||timeout>=interval){toast('请填写名称、目标，间隔≥15 秒且超时小于间隔');return}S.v08.monitors.unshift({id:'mon'+Date.now(),name,type:V('m08type'),target,interval,timeout,fail:3,recover:2,status:'待确认',source:V('m08source'),linked:null,paused:false});log('新增模拟监控',name);closeModal();render()}
function sf08CheckMonitor(id){let m=S.v08.monitors.find(x=>x.id===id);if(!m||m.paused)return;let states=['正常','异常','未知','待确认'];m.status=states[(states.indexOf(m.status)+1)%states.length];log('模拟监控探测',m.name+' → '+m.status);render()}
function sf08ToggleMonitor(id){let m=S.v08.monitors.find(x=>x.id===id);if(m){m.paused=!m.paused;log('监控启停',m.name);render()}}
function sf08DelMonitor(id){let m=S.v08.monitors.find(x=>x.id===id);if(!m)return;confirmBox('删除演示监控','仅删除模拟监控记录。',`sf08DelMonitorApply('${id}')`)}
function sf08DelMonitorApply(id){S.v08.monitors=S.v08.monitors.filter(x=>x.id!==id);closeModal();render()}
function sf08AlertEvents(){return pageTitle('告警规则与事件','整合节点资源告警与服务健康事件，避免同一故障重复通知。')+panel('既有告警事件',table(['节点/来源','信息','严重级别','状态'],S.alerts.map(a=>`<tr><td>${E(a.node)}</td><td>${E(a.message)}</td><td>${E(a.level)}</td><td>${a.ack?'已确认':'待确认'}</td></tr>`).join('')))+panel('服务事件（模拟）',table(['监控名称','当前状态','事件说明'],S.v08.monitors.filter(x=>x.status!=='正常').map(x=>`<tr><td>${E(x.name)}</td><td>${E(x.status)}</td><td>${x.status==='未知'?'探测来源不可用时不得判定业务故障':'等待连续探测确认'}</td></tr>`).join('')))+'<div class="help">通知渠道仍使用既有 QQ Bot 与 SMTP；维护窗口可静默通知，但保留检测记录。</div>'}
function modalTask(){modalTaskBase();if(!modal)return;modal.body=modal.body.replace('<div class="caption-safety">选择服务组后',`<div class="field"><label>安全执行策略</label><select id="sf08TaskPolicy"><option value="canary">金丝雀：先 1 台、再分批</option><option value="batch">分批执行：每批最多 3 台</option><option value="regular">普通执行：按并发限制</option></select></div><div class="formcols">${formField('失败熔断阈值（台）','sf08FailLimit','number','1')}${formField('离线任务有效期（分钟）','sf08TaskTTL','number','30')}</div><div class="sf08-warning">预演仅对支持预检查的操作有效；任意 Shell 命令不承诺无副作用。危险操作需重新审批；任务目标快照不会自动增加新节点。</div><div class="caption-safety">选择服务组后`);renderModal()}
function createTask(){const policy=V('sf08TaskPolicy')||'regular',maxFailed=+(V('sf08FailLimit')||'1'),ttl=+(V('sf08TaskTTL')||'30');if(maxFailed<1||ttl<1){toast('熔断阈值和任务有效期必须为正整数');return}let before=S.tasks.length;createTaskBase();if(S.tasks.length===before)return;let t=S.tasks[0];t.safetyPolicy=policy;t.maxFailures=maxFailed;t.ttlMinutes=ttl;t.phase=policy==='canary'?'第 1 批：金丝雀 1 台':policy==='batch'?'分批准备':'普通执行';t.status=policy==='canary'&&t.status==='成功'?'模拟金丝雀检查中':t.status;S.v08.taskRunHistory.unshift({id:t.id,policy,maxFailed,ttl,scope:[...(t.targetNodeIdsSnapshot||[])]});save();render()}
function tasks(){return tasksV08()}
function tasksV08(){let p={canary:'金丝雀',batch:'分批',regular:'普通'};return pageTitle('批量任务','选择目标、设置安全执行策略、限制失败扩大影响，逐节点记录执行结果。',btn('+ 创建安全任务','modalTask()','primary'))+`<div class="sf08-grid">${stat('任务总数',S.tasks.length)}${stat('金丝雀任务',S.tasks.filter(t=>t.safetyPolicy==='canary').length)}${stat('待审批任务',S.tasks.filter(t=>t.status==='等待审批').length)}</div>${panel('任务列表',table(['名称','目标','策略','阶段','状态','操作'],S.tasks.map(t=>`<tr><td>${E(t.name)}</td><td>${E(t.target)}</td><td>${E(p[t.safetyPolicy]||'旧任务')}</td><td>${E(t.phase||'已完成')}</td><td>${tag(t.status,t.status.includes('失败')?'red':'blue')}</td><td>${btn('查看',`modalTaskDetail('${t.id}')`,'sm')}${t.safetyPolicy==='canary'?btn('模拟通过并继续',`sf08CanaryAdvance('${t.id}')`,'sm')+btn('模拟失败熔断',`sf08CanaryStop('${t.id}')`,'sm danger'):''}</td></tr>`).join('')))}<div class="sf08-warning">所有任务均为本地模拟。正式后端必须对每一批、每一节点在执行前再次校验权限与服务健康；失败停止后续批次，不等于已执行任务自动回滚。</div>`}
function sf08CanaryAdvance(id){let t=S.tasks.find(x=>x.id===id);if(!t||t.status==='失败熔断')return;t.phase='批次完成（演示）';t.status='模拟完成';log('模拟推进金丝雀任务',t.name);render()}
function sf08CanaryStop(id){let t=S.tasks.find(x=>x.id===id);if(!t)return;t.status='失败熔断';t.phase='已阻止后续批次';log('模拟任务熔断',t.name,'失败');render()}
function detail(){if(S.detailTab==='连接诊断')return sf08NodeDiagnostic();if(S.detailTab==='流量与配额')return sf08Traffic();return detailBase()}
function sf08DetailHeader(n){let tabs=['基础信息','监控','进程与服务','网络','流量与配额','连接诊断','文件管理','模拟终端','操作记录'];return pageTitle(n.name,'节点详情 · '+n.provider+' / '+n.region)+`<section class="panel"><div class="pilltabs">${tabs.map(t=>`<button class="${S.detailTab===t?'active':''}" onclick="app.detailTab('${t}')">${t}</button>`).join('')}</div></section>`}
function sf08NodeDiagnostic(){let n=node(S.selectedNode)||S.nodes[0];return sf08DetailHeader(n)+`<div class="grid g3">${stat('连接状态',n.online?'在线':'离线')}${stat('Agent 版本',n.version)}${stat('身份凭证','模拟登记')}</div>${panel('连接诊断',`<div class="sf08-stack">${sf08Row('最近心跳',n.online?'刚刚（模拟）':'已超时（模拟）')}${sf08Row('证书状态','需要真实后端验证')}${sf08Row('未执行任务策略','离线任务超时失效，危险任务重连后需重新审批')}${sf08Row('确切故障原因',n.online?'无已知故障':'未知：不能确定关机还是网络问题')}</div><div class="sf08-action">${btn('模拟重连诊断',`sf08Diagnose('${n.id}')`,'primary')}${btn('查看批量任务',"go('tasks')")}</div>`)}<div class="sf08-warning">重连时必须重新验证身份；被撤销的旧凭据不得继续使用。离线 Agent 不应在重新上线后立即执行过期危险任务。</div>`}
function sf08Diagnose(id){let n=node(id);modalOpen('连接诊断 · '+E(n?.name||id),`<div class="sf08-stack"><p>模拟检查：${n?.online?'心跳有效（演示）':'主控未收到心跳（无法确认原因）'}</p><p>身份凭证与 Agent 状态只有真实连接后才能验证。</p></div>`,btn('关闭','closeModal()'))}
function sf08Traffic(){let n=node(S.selectedNode)||S.nodes[0],t=S.v08.traffic[n.id],ratio=t.quota?100*t.used/t.quota:0;return sf08DetailHeader(n)+`<div class="grid g4">${stat('本周期估算流量',t.used+' GB',t.source)}${stat('手动设置配额',t.quota+' GB')}${stat('使用率',ratio.toFixed(1)+'%')}${stat('节点到期日期',t.expires)}</div>${panel('配额与告警规则',`<div class="progress" style="margin:10px 0 20px"><i style="width:${Math.min(100,ratio)}%"></i></div>${sf08Row('统计来源',t.source)}${sf08Row('计费方向',t.direction)}${sf08Row('计费周期',t.cycle+' · 每月 '+t.resetDay+' 日')}${sf08Row('数据完整性',t.complete?'模拟完整':'存在离线数据缺口')}${sf08Row('阈值提醒','70% / 85% / 95%')}${sf08Row('到期前提醒',t.remind+' 天')}<div class="sf08-action">${btn('修改配额与到期',`sf08TrafficEdit('${n.id}')`,'primary')}${btn('模拟配额告警',`sf08TrafficWarn('${n.id}')`,'sm')}</div>`)}<div class="sf08-warning">网卡估算值不等于云厂商账单流量；缺少账单数据时不得显示为实际扣费金额。默认只告警，不会自动断网。</div>`}
function sf08TrafficEdit(id){let t=S.v08.traffic[id];modalOpen('编辑节点流量与到期提醒',`${formField('月配额（GB）','trafficQuota','number',t.quota)}${formField('重置日（1–28）','trafficReset','number',t.resetDay)}${formField('节点到期日','trafficExpiry','date',t.expires)}${formField('到期前提醒（天）','trafficRemind','number',t.remind)}<div class="field"><label>统计方向</label><select id="trafficDir">${['出站','入站','合计'].map(x=>`<option ${x===t.direction?'selected':''}>${x}</option>`).join('')}</select></div>`,ok('保存模拟配额',`sf08TrafficSave('${id}')`))}
function sf08TrafficSave(id){let t=S.v08.traffic[id],q=+V('trafficQuota'),d=+V('trafficReset'),rem=+V('trafficRemind');if(q<=0||d<1||d>28||rem<0||!V('trafficExpiry')){toast('请输入有效的配额、日期和周期');return}t.quota=q;t.resetDay=d;t.expires=V('trafficExpiry');t.remind=rem;t.direction=V('trafficDir');log('更新模拟流量配额',node(id)?.name||id);closeModal();render()}
function sf08TrafficWarn(id){let n=node(id),t=S.v08.traffic[id];log('模拟配额提醒',n?.name||id);toast('模拟提醒：'+Math.round(100*t.used/t.quota)+'% 使用率；实际未发送通知')}
function backups(){return backupsBase()+panel('主控灾难恢复（v0.8）',`<div class="sf08-warning">恢复流程必须能在新安装的主控执行。离线 Root CA 私钥不得随普通备份导出；防止旧主控恢复后与新主控同时发号施令。</div><div class="sf08-grid"><div class="sf08-box">${sf08Row('备份验证','完整性 / 加密材料 / 版本兼容')}${sf08Row('主控身份','切换前需证明旧主控已隔离')}${sf08Row('Agent 重连','逐个显示身份验证结果')}</div><div class="sf08-box">${sf08Row('恢复作业状态',S.v08.recovery.restorePhase)}${sf08Row('最近验证',S.v08.recovery.lastCheck)}<div class="sf08-action">${btn('模拟备份校验','sf08RestoreCheck()','sm')}${btn('启动恢复演练','sf08RestoreAsk()','sm primary')}</div></div></div><div class="help">正式实施应覆盖备份解密失败、不可逆迁移、双主控冲突、部分节点无法重连、RPO/RTO 验证等场景。</div>`)}
function sf08RestoreCheck(){S.v08.recovery.lastCheck='刚刚：模拟文件结构检查通过；密钥未真实校验';log('模拟备份校验','主控备份');render()}
function sf08RestoreAsk(){modalOpen('主控恢复演练（模拟）',`<label class="checkbox-label"><input type="checkbox" id="sf08Fence"> 我确认旧主控已经停止控制节点（演示确认）</label><div class="sf08-warning">未经旧主控隔离验证，不得恢复同一身份的控制面。真实备份与离线 CA 密钥仍需单独处理。</div>`,ok('开始模拟演练','sf08RestoreApply()'))}
function sf08RestoreApply(){if(!CK('sf08Fence')){toast('请先确认旧主控已停止控制节点');return}S.v08.recovery.oldControllerFenced=true;S.v08.recovery.restorePhase='模拟演练完成（未恢复真实数据）';log('模拟主控恢复演练','新主控');closeModal();render()}
function secretsV08(){ensureV08();return `<div class="sf08-warning">这是凭据元数据演示。请勿输入真实 API Key、SMTP 密码或 CA 私钥。真实密钥应由服务端安全存储，UI/API 不回显明文；AI 完全访问也不能读取任意密钥。</div><div class="sf08-action">${btn('+ 登记凭据元数据','sf08SecretAdd()','primary')}</div>${table(['名称','类型','授权用途','验证状态','引用数','操作'],S.v08.credentials.map(c=>`<tr><td><b>${E(c.name)}</b></td><td>${E(c.kind)}</td><td>${E(c.usage)}</td><td>${tag(c.state,c.state==='已验证'?'green':'orange')}</td><td>${c.refs}</td><td>${btn('模拟验证',`sf08SecretVerify('${c.id}')`,'sm')}${btn('轮换',`sf08SecretRotate('${c.id}')`,'sm')}${btn('撤销',`sf08SecretRevoke('${c.id}')`,'sm danger')}</td></tr>`).join(''))}<div class="help">统一引用 Cloudflare、QQ Bot、SMTP、AI 模型等敏感凭据；插件按权限请求操作能力，而不是直接读取明文。</div>`}
function sf08SecretAdd(){modalOpen('登记凭据（不输入真实密钥）',`${formField('凭据名称','c08name')}<div class="formcols"><div class="field"><label>凭据类型</label><select id="c08kind"><option>API Token</option><option>密码</option><option>AppSecret</option><option>API Key</option></select></div><div class="field"><label>授权用途</label><select id="c08usage"><option>DNS 管理</option><option>SMTP 通知</option><option>QQ Bot 通知</option><option>AI 运维</option></select></div></div><div class="sf08-warning">为安全起见，本演示不提供真实密钥输入框。正式系统应实现只写、加密、轮换和撤销流程。</div>`,ok('添加演示凭据','sf08SecretSave()'))}
function sf08SecretSave(){let n=V('c08name').trim();if(!n){toast('请输入名称');return}S.v08.credentials.push({id:'c'+Date.now(),name:n,kind:V('c08kind'),usage:V('c08usage'),state:'未验证',refs:0,last:'从未'});log('新增演示凭据元数据',n);closeModal();render()}
function sf08SecretVerify(id){let c=S.v08.credentials.find(x=>x.id===id);if(c){c.last='刚刚';c.state='模拟检查（非真实验证）';log('模拟凭据检查',c.name);render()}}
function sf08SecretRotate(id){let c=S.v08.credentials.find(x=>x.id===id);if(!c)return;modalOpen('轮换流程：'+E(c.name),`<p>先验证新凭据有效性，再切换引用，最后撤销旧凭据。泄露凭据应立即撤销。</p><div class="sf08-warning">不收集真实密钥；仅演示元数据变更。</div>`,ok('模拟轮换','sf08SecretRotateApply(\''+id+'\')'))}
function sf08SecretRotateApply(id){let c=S.v08.credentials.find(x=>x.id===id);if(c){c.state='模拟轮换待验证';log('模拟凭据轮换',c.name)}closeModal();render()}
function sf08SecretRevoke(id){let c=S.v08.credentials.find(x=>x.id===id);if(!c)return;confirmBox('撤销演示凭据',`「${E(c.name)}」当前有 ${c.refs} 个引用；正式操作必须显示受影响的通知、DNS 或 AI 配置。`,`sf08SecretRevokeApply('${id}')`)}
function sf08SecretRevokeApply(id){let c=S.v08.credentials.find(x=>x.id===id);if(c){c.state='已撤销';log('模拟撤销凭据',c.name)}closeModal();render()}
Object.assign(app,{sf08PublishSet,sf08ToggleGateway,sf08PublishDNSAccount,sf08PublishStep,sf08PublishConfirm,sf08PublishApply,sf08PubDetail,sf08MonitorTab,sf08NewMonitor,sf08SaveMonitor,sf08CheckMonitor,sf08ToggleMonitor,sf08DelMonitor,sf08DelMonitorApply,sf08CanaryAdvance,sf08CanaryStop,sf08Diagnose,sf08TrafficEdit,sf08TrafficSave,sf08TrafficWarn,sf08RestoreCheck,sf08RestoreAsk,sf08RestoreApply,sf08SecretAdd,sf08SecretSave,sf08SecretVerify,sf08SecretRotate,sf08SecretRotateApply,sf08SecretRevoke,sf08SecretRevokeApply});window.app=app;render();})();
</script></body></html>
